name: Patch stable recueil
on:
  push:
    branches: [stabilize/portal-hardening-20260822]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/portal-hardening-20260822
          fetch-depth: 0
      - name: Integrate safe recueil controls in React
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          old = "function isBlank(value: unknown): boolean { return value === null || value === undefined || String(value).trim() === ''; }"
          new = """function isBlank(value: unknown): boolean { return value === null || value === undefined || String(value).trim() === ''; }\nfunction isValidMobile(value: unknown): boolean {\n  const compact = String(value ?? '').trim().replace(/[\\s().-]/g, '');\n  const digits = compact.replace(/\\D/g, '');\n  if (!digits || ['0000000000', '0123456789', '1234567890'].includes(digits)) return false;\n  if (/^(\\d)\\1+$/.test(digits) && digits.length >= 8) return false;\n  if (/^0[67]\\d{8}$/.test(compact)) return true;\n  if (/^\\+33[67]\\d{8}$/.test(compact)) return true;\n  return /^\\+[1-9]\\d{7,14}$/.test(compact);\n}"""
          if old not in s: raise SystemExit('isBlank marker missing')
          s = s.replace(old, new, 1)

          old = "function MoneyField(props: Omit<React.ComponentProps<typeof Field>, 'type'>) { return <Field {...props} type=\"number\" />; }"
          new = """function MoneyField(props: Omit<React.ComponentProps<typeof Field>, 'type'>) { return <Field {...props} type=\"number\" />; }\n\nfunction MonthYearField({ value, onChange, required = false }: { value: string; onChange: (value: string) => void; required?: boolean }) {\n  const match = /^(\\d{4})-(0[1-9]|1[0-2])/.exec(String(value ?? ''));\n  const yearValue = match?.[1] ?? '';\n  const monthValue = match?.[2] ?? '';\n  const currentYear = new Date().getFullYear();\n  const years = Array.from({ length: currentYear - 1939 }, (_, index) => String(currentYear - index));\n  const months = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, '0'));\n  const commit = (month: string, year: string) => onChange(month && year ? `${year}-${month}-01` : '');\n  return <div className=\"rounded-2xl bg-[#0b1f3a] p-3 text-sm font-semibold text-white shadow-sm\">\n    <p>Date d’entrée dans l’entreprise : mois / année{required && ' *'}</p>\n    <p className=\"mt-1 text-xs font-normal leading-5 text-blue-100\">Sélectionnez le mois puis l’année. Exemple : 05 / 2015.</p>\n    <div className=\"mt-3 grid grid-cols-[1fr_auto_1fr] items-end gap-2 rounded-xl bg-white p-3 text-slate-700\">\n      <label className=\"!bg-transparent !p-0 !text-slate-700 !shadow-none\"><span className=\"text-xs font-medium\">Mois</span><select aria-label=\"Mois d’entrée\" value={monthValue} onChange={(event) => commit(event.target.value, yearValue)} className=\"mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm font-normal text-slate-800 outline-none focus:border-[#6f8fb4] focus:bg-white\"><option value=\"\">MM</option>{months.map((month) => <option key={month} value={month}>{month}</option>)}</select></label>\n      <span className=\"pb-3 text-lg font-semibold text-slate-500\">/</span>\n      <label className=\"!bg-transparent !p-0 !text-slate-700 !shadow-none\"><span className=\"text-xs font-medium\">Année</span><select aria-label=\"Année d’entrée\" value={yearValue} onChange={(event) => commit(monthValue, event.target.value)} className=\"mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm font-normal text-slate-800 outline-none focus:border-[#6f8fb4] focus:bg-white\"><option value=\"\">AAAA</option>{years.map((year) => <option key={year} value={year}>{year}</option>)}</select></label>\n    </div>\n  </div>;\n}\n\nfunction ReadOnlyField({ label, value, help }: { label: string; value: string; help?: string }) {\n  return <label className=\"text-sm font-semibold text-slate-700\">{label}<input type=\"email\" readOnly value={value} className=\"mt-2 w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-slate-700 outline-none\" />{help && <span className=\"mt-1.5 block text-xs font-normal leading-5 text-blue-100\">{help}</span>}</label>;\n}"""
          if old not in s: raise SystemExit('MoneyField marker missing')
          s = s.replace(old, new, 1)

          old = "  const [errorMessage, setErrorMessage] = useState('');\n  const progress = useMemo(() => selectedProgress(rows, dossierId), [rows, dossierId]);"
          new = "  const [errorMessage, setErrorMessage] = useState('');\n  const [accountEmail, setAccountEmail] = useState('');\n  const progress = useMemo(() => selectedProgress(rows, dossierId), [rows, dossierId]);"
          if old not in s: raise SystemExit('state marker missing')
          s = s.replace(old, new, 1)

          old = "  useEffect(() => {\n    void fetchPortalProgress().then(async (progressRows) => {"
          new = "  useEffect(() => {\n    void supabase.auth.getUser().then(({ data }) => setAccountEmail(data.user?.email ?? '')).catch(() => setAccountEmail(''));\n    void fetchPortalProgress().then(async (progressRows) => {"
          if old not in s: raise SystemExit('effect marker missing')
          s = s.replace(old, new, 1)

          old = "      if ([form.civilite, form.prenom, form.nom, form.date_naissance, form.lieu_naissance, form.pays_naissance, form.nationalite, form.mobile].some(isBlank)) throw new Error('Complétez tous les champs obligatoires de votre identité.');\n      if (identityNeedsBirthName"
          new = "      if ([form.civilite, form.prenom, form.nom, form.date_naissance, form.lieu_naissance, form.pays_naissance, form.nationalite, form.mobile].some(isBlank)) throw new Error('Complétez tous les champs obligatoires de votre identité.');\n      if (!isValidMobile(form.mobile)) throw new Error('Indiquez un numéro de mobile valide. Les numéros fictifs comme 0000000000 sont refusés.');\n      if (identityNeedsBirthName"
          if old not in s: raise SystemExit('identity validation marker missing')
          s = s.replace(old, new, 1)

          old = "<Field label=\"Mobile\" required value={form.mobile} onChange={(v) => patchCurrent({ mobile: v })} /></div><div className=\"border-t border-slate-100 pt-5\">"
          new = "<Field label=\"Mobile\" required value={form.mobile} onChange={(v) => patchCurrent({ mobile: v })} placeholder=\"06 12 34 56 78 ou +33 6 12 34 56 78\" />{accountEmail && <ReadOnlyField label=\"E-mail *\" value={accountEmail} help=\"Adresse liée à votre accès sécurisé : elle est reprise automatiquement afin d’éviter une erreur de saisie.\" />}</div><div className=\"border-t border-slate-100 pt-5\">"
          if old not in s: raise SystemExit('mobile render marker missing')
          s = s.replace(old, new, 1)

          old = "<Field label=\"Date d’entrée dans l’entreprise : mois / année\" required={professionalNeedsEmployer} type=\"month\" value={String(form.date_entree ?? '').slice(0, 7)} onChange={(v) => patchCurrent({ date_entree: v ? `${v}-01` : '' })} />"
          new = "<MonthYearField required={professionalNeedsEmployer} value={String(form.date_entree ?? '')} onChange={(v) => patchCurrent({ date_entree: v })} />"
          if old not in s: raise SystemExit('date field marker missing')
          s = s.replace(old, new, 1)

          old = "{doneSections.has(section.code) ? '✓ ' : ''}{index + 1}</button>)}</div></div>"
          new = "{doneSections.has(section.code) ? '✓ ' : ''}{index + 1}. {['Identité', 'Famille', 'Profession', 'Objectifs', 'Revenus', 'Réglementaire', 'Patrimoine'][index]}</button>)}</div></div>"
          if old not in s: raise SystemExit('navigation marker missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Intégrer nativement les contrôles du Recueil"
          git push origin stabilize/portal-hardening-20260822
