name: Remove unused patrimonyReady

on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-unused-patrimony-ready.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove unused constant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          start = s.index("  const patrimonyReady = current.code !== 'patrimony'")
          end = s.index("\n\n  return <div>", start)
          s = s[:start] + s[end+2:]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m 'Remove unused patrimonyReady validation flag'
          git push
