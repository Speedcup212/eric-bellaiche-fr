name: Patch patrimony crash-test UX

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_patrimony_crash_test_ux.mjs
      - .github/workflows/patch-patrimony-crash-test-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/patch_patrimony_crash_test_ux.mjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx src/portal/FintechJourney.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Polish patrimony final-step UX"
            git push
          fi
