name: Patch pedagogical recueil
on:
  push:
    branches: [feat/pedagogical-recueil-theme]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pedagogical-recueil-theme
      - name: Patch client journey
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          s = s.replace("  { code: 'tax', title: 'Fiscalité', description: 'Reportez les principales données de votre avis d’imposition et, le cas échéant, de votre IFI.' },\n", "")
          s = s.replace("  { code: 'credits', title: 'Financements et crédits', description: 'Déclarez les crédits en cours. Une liste vide vaut déclaration d’absence de crédit.' },\n", "")
          s = s.replace("      if (professionalNeedsEmployer && (isBlank(form.societe) || isBlank(form.anciennete_annees))) throw new Error('Renseignez votre société / employeur et votre ancienneté.');", "      if (professionalNeedsEmployer && (isBlank(form.societe) || isBlank(form.date_entree))) throw new Error('Renseignez votre société / employeur et votre date d’entrée dans l’entreprise ou de début d’activité.');")
          s = s.replace("<Field label=\"Ancienneté (années)\" required={professionalNeedsEmployer} type=\"number\" value={form.anciennete_annees} onChange={(v) => patchCurrent({ anciennete_annees: v })} /><Field label=\"Date d’entrée\" type=\"date\" value={form.date_entree} onChange={(v) => patchCurrent({ date_entree: v })} />", "<Field label=\"Depuis quelle date travaillez-vous dans cette entreprise / activité ?\" required={professionalNeedsEmployer} type=\"date\" value={form.date_entree} onChange={(v) => patchCurrent({ date_entree: v })} />")
          s = s.replace("if (isBlank(item.montant_cible) || isBlank(item.horizon_annees) || Number(item.horizon_annees) < 0) throw new Error('Indiquez un montant cible et un horizon pour chaque objectif.');", "if (isBlank(item.horizon_annees) || Number(item.horizon_annees) < 0) throw new Error('Indiquez un horizon pour chaque objectif.');\n        if (item.code_objectif !== 'retraite' && isBlank(item.montant_cible)) throw new Error('Indiquez un montant cible lorsque cet objectif nécessite un montant.');")
          s = s.replace("<MoneyField label=\"Montant cible (€)\" required value={item.montant_cible}", "<MoneyField label={item.code_objectif === 'retraite' ? 'Capital cible estimé (€) — facultatif' : 'Quel montant souhaitez-vous consacrer à cet objectif ? (€)'} required={item.code_objectif !== 'retraite'} value={item.montant_cible}")
          s = s.replace("<MoneyField label=\"Revenus du travail estimés annuels (€)\" required value={form.estimation_revenus_travail_annuels}", "<MoneyField label=\"À combien estimez-vous vos revenus professionnels pour l’année en cours ? (€)\" required value={form.estimation_revenus_travail_annuels}")
          s = s.replace("<MoneyField label=\"Revenus fonciers estimés annuels (€)\" required value={form.estimation_revenus_fonciers_annuels}", "<MoneyField label=\"À combien estimez-vous vos revenus provenant de biens immobiliers pour l’année en cours ? (€)\" required value={form.estimation_revenus_fonciers_annuels}")
          s = s.replace("<MoneyField label=\"Épargne de précaution cible (€)\" required value={form.epargne_precaution_cible}", "<MoneyField label=\"Quelle somme souhaitez-vous conserver disponible pour faire face aux imprévus ? (€)\" required value={form.epargne_precaution_cible}")
          s = s.replace("<MoneyField label=\"Capacité d’épargne mensuelle (€)\" required value={form.capacite_epargne_mensuelle}", "<MoneyField label=\"Combien pouvez-vous mettre de côté chaque mois sans déséquilibrer votre budget ? (€)\" required value={form.capacite_epargne_mensuelle}")
          s = s.replace("<MoneyField label=\"Apport immobilier possible (€)\" value={form.apport_immobilier_possible}", "<MoneyField label=\"Quelle somme pourriez-vous utiliser comme apport pour un projet immobilier ? (€)\" value={form.apport_immobilier_possible}")
          s = s.replace("<SecureNote>Les champs marqués * sont obligatoires.", "<SecureNote>Les champs marqués * sont obligatoires. Les informations fiscales et les crédits ne vous sont pas demandés ici : ils seront renseignés à partir des justificatifs transmis en fin de parcours.")
          p.write_text(s)

          p = Path('src/portal/FintechJourney.tsx')
          s = p.read_text()
          old = '''  return (\n    <div className=\"mb-6 mt-6\">\n      <div className=\"flex items-center gap-3\">\n        <div className=\"flex h-11 w-11 items-center justify-center rounded-2xl bg-[#0b1f3a] text-white shadow-lg shadow-[#0b1f3a]/10\">\n          {icon ?? <Sparkles className=\"h-5 w-5\" />}\n        </div>\n        <div>\n          <p className=\"text-xs font-bold uppercase tracking-[0.18em] text-[#7f8da1]\">{eyebrow}</p>\n          <h2 className=\"mt-1 text-2xl font-semibold tracking-tight text-[#0b1f3a] sm:text-3xl\">{title}</h2>\n        </div>\n      </div>\n      <p className=\"mt-4 max-w-3xl text-sm leading-6 text-[#5b6b82] sm:text-base\">{description}</p>\n    </div>\n  );'''
          new = '''  return (\n    <div className=\"mb-6 mt-6 overflow-hidden rounded-[28px] border border-[#173967] bg-gradient-to-br from-[#071a33] via-[#0b1f3a] to-[#173967] px-6 py-6 text-white shadow-[0_24px_60px_-30px_rgba(11,31,58,0.65)] sm:px-8 sm:py-7\">\n      <div className=\"flex items-center gap-3\">\n        <div className=\"flex h-11 w-11 items-center justify-center rounded-2xl border border-white/15 bg-white/10 text-white\">\n          {icon ?? <Sparkles className=\"h-5 w-5\" />}\n        </div>\n        <div>\n          <p className=\"text-xs font-bold uppercase tracking-[0.18em] text-blue-200\">{eyebrow}</p>\n          <h2 className=\"mt-1 text-2xl font-semibold tracking-tight text-white sm:text-3xl\">{title}</h2>\n        </div>\n      </div>\n      <p className=\"mt-4 max-w-3xl text-sm leading-6 text-blue-100/80 sm:text-base\">{description}</p>\n    </div>\n  );'''
          if old not in s:
              raise SystemExit('PageIntro block not found')
          s = s.replace(old, new)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx src/portal/FintechJourney.tsx
          git commit -m "Simplifier le recueil et harmoniser la charte bleu nuit"
          git push origin HEAD:feat/pedagogical-recueil-theme