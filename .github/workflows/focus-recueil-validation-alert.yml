name: Focus recueil validation alert

on:
  push:
    paths:
      - '.github/workflows/focus-recueil-validation-alert.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep validation message visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          anchor = "  const previous = () => {\n"
          effect = """  useEffect(() => {\n    if (!errorMessage) return;\n    const timer = window.setTimeout(() => {\n      document.getElementById('recueil-validation-alert')?.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    }, 50);\n    return () => window.clearTimeout(timer);\n  }, [errorMessage]);\n\n"""
          if effect not in s:
              if anchor not in s:
                  raise SystemExit('previous anchor not found')
              s = s.replace(anchor, effect + anchor, 1)

          old = '''{errorMessage && <div role="alert" className="rounded-2xl border border-amber-400/60 bg-amber-50 px-5 py-4 text-sm leading-6 text-amber-950 shadow-sm">'''
          new = '''{errorMessage && <div id="recueil-validation-alert" role="alert" tabIndex={-1} className="scroll-mt-28 rounded-2xl border border-amber-400/60 bg-amber-50 px-5 py-4 text-sm leading-6 text-amber-950 shadow-sm">'''
          if old not in s:
              raise SystemExit('alert block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m 'Keep recueil validation alert visible after click'
          git push origin main
