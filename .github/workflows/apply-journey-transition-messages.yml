name: Apply journey transition messages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-journey-transition-messages.cjs'
      - '.github/workflows/apply-journey-transition-messages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply transition UX patch
        run: node scripts/patch-journey-transition-messages.cjs
      - name: Commit application changes
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyPage.tsx src/pages/portal/QuestionnairePageBase.tsx
          git commit -m "Add clear transition screens between client journey steps"
          git push origin main
