name: Refine recueil validation highlights

on:
  push:
    paths:
      - '.github/workflows/refine-recueil-validation-highlights.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch validation visuals
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('src/index.css')
          s = css.read_text()
          old = '''.recueil-safe [data-recueil-missing="1"] { outline: 2px solid rgb(239 68 68 / 0.75); outline-offset: 2px; }
.recueil-safe [data-recueil-missing="1"]::after { content: "À compléter"; display: inline-flex; margin-top: 0.5rem; border-radius: 0.5rem; background: #b91c1c; padding: 0.25rem 0.625rem; color: #fff; font-size: 0.75rem; font-weight: 700; }
.recueil-safe [data-recueil-section-missing="1"] { border-color: #fca5a5 !important; background: #fef2f2 !important; color: #b91c1c !important; box-shadow: 0 0 0 1px rgb(248 113 113 / 0.35) !important; }
'''
          new = '''/* Validation du recueil : ne pas surligner automatiquement des blocs complets.
   Les erreurs sont signalées après clic, par l’encart orange et par le champ réellement concerné. */
.recueil-safe [data-recueil-missing="1"],
.recueil-safe [data-recueil-section-missing="1"] {
  outline: none !important;
  box-shadow: none !important;
}
.recueil-safe [data-recueil-missing="1"]::after { content: none !important; display: none !important; }
.recueil-safe [data-recueil-section-missing="1"] {
  border-color: inherit !important;
  background: inherit !important;
  color: inherit !important;
}
'''
          if old not in s:
              raise SystemExit('Expected legacy red validation CSS not found')
          css.write_text(s.replace(old, new))

          tsx = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = tsx.read_text()
          old = '''                {(item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && <Field label={item.proprietaire === 'Identifiant 1 et 2' ? 'Quote-part de l’Identifiant 1 (%)' : 'Quote-part détenue (%)'} required type="number" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: v })} placeholder="Ex. 50" help={item.proprietaire === 'Identifiant 1 et 2' ? 'La part de l’Identifiant 2 sera déduite automatiquement (100 % moins cette valeur).' : 'Indiquez la part réellement détenue dans le bien.'} />}
'''
          new = '''                {(item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && <div className={errorMessage.includes('quote-part') ? 'rounded-xl border-2 border-amber-400 bg-amber-400/10 p-3' : ''}><Field label={item.proprietaire === 'Identifiant 1 et 2' ? 'Quote-part de l’Identifiant 1 (%)' : 'Quote-part détenue (%)'} required type="number" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: v })} placeholder="Ex. 50" help={item.proprietaire === 'Identifiant 1 et 2' ? 'La part de l’Identifiant 2 sera déduite automatiquement (100 % moins cette valeur).' : 'Indiquez la part réellement détenue dans le bien.'} />{errorMessage.includes('quote-part') && <p className="mt-2 text-xs font-semibold text-amber-300">Indiquez uniquement le nombre, par exemple 50.</p>}</div>}
'''
          if old not in s:
              raise SystemExit('Expected quote-part field block not found')
          tsx.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.css src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m 'Refine recueil validation highlights'
          git push origin main
