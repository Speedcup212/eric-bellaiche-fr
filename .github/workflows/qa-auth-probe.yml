name: QA Supabase auth probe

on:
  push:
    paths:
      - 'scripts/qa-auth-probe.mjs'
      - '.github/workflows/qa-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe real Supabase signup/session
        env:
          QA_SUPABASE_URL: https://nqnmahnkpdiwdfiteops.supabase.co
          QA_SUPABASE_ANON_KEY: sb_publishable_WY4MeGVyB1CMnedTdQcy4Q_VitoPeH5
        run: node scripts/qa-auth-probe.mjs
