name: Apply QA E2E auth provisioning fallback

on:
  push:
    paths:
      - 'scripts/patch-qa-e2e-provision-fallback.cjs'
      - '.github/workflows/apply-qa-e2e-provision-fallback.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/patch-qa-e2e-provision-fallback.cjs
      - run: node --check scripts/qa-e2e-couple.mjs
      - name: Commit patched E2E runner
        run: |
          if git diff --quiet -- scripts/qa-e2e-couple.mjs; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qa-e2e-couple.mjs
          git commit -m 'Use QA auth provisioning fallback in E2E'
          git push
