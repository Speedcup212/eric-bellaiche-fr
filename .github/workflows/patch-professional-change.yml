name: Patch professional change fields
on:
  push:
    branches: [feat/professional-change-date-label]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professional-change-date-label
          fetch-depth: 0
      - name: Patch recueil professional section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          replacements = [
            (
              "professional: { profession_actuelle: '', societe: '', secteur_activite: '', statut: '', categorie_socioprofessionnelle: '', anciennete_annees: '', date_entree: '', origine_revenus_sans_activite: '', precisions: '' },",
              "professional: { profession_actuelle: '', societe: '', secteur_activite: '', statut: '', categorie_socioprofessionnelle: '', anciennete_annees: '', date_entree: '', origine_revenus_sans_activite: '', changement_professionnel_prevu: '', changement_professionnel_details: '', precisions: '' },"
            ),
            (
              "const professionalNeedsIncomeOrigin = professionalStatus.includes('sans activité') || professionalStatus.includes('sans activite');",
              "const professionalNeedsIncomeOrigin = professionalStatus.includes('sans activité') || professionalStatus.includes('sans activite');\n  const professionalNeedsChangeQuestion = !professionalStatus.includes('retrait');"
            ),
            (
              "if (professionalNeedsEmployer && (isBlank(form.societe) || isBlank(form.date_entree))) throw new Error('Renseignez votre société / employeur et votre date d’entrée dans l’entreprise ou de début d’activité.');\n      if (professionalNeedsIncomeOrigin && isBlank(form.origine_revenus_sans_activite)) throw new Error('Précisez l’origine de vos revenus lorsque vous êtes sans activité.');",
              "if (professionalNeedsEmployer && (isBlank(form.societe) || isBlank(form.date_entree))) throw new Error('Renseignez votre entreprise et votre date d’entrée (mois / année).');\n      if (professionalNeedsIncomeOrigin && isBlank(form.origine_revenus_sans_activite)) throw new Error('Précisez l’origine de vos revenus lorsque vous êtes sans activité.');\n      if (professionalNeedsChangeQuestion && form.changement_professionnel_prevu === '') throw new Error('Indiquez si un changement professionnel est prévu dans les prochains mois.');\n      if (professionalNeedsChangeQuestion && form.changement_professionnel_prevu === true && isBlank(form.changement_professionnel_details)) throw new Error('Précisez le changement professionnel prévu.');"
            ),
            (
              "{current.code === 'professional' && <div className=\"grid gap-4 sm:grid-cols-2\"><Field label=\"Profession actuelle\" required value={form.profession_actuelle} onChange={(v) => patchCurrent({ profession_actuelle: v })} /><Field label=\"Société / employeur\" required={professionalNeedsEmployer} value={form.societe} onChange={(v) => patchCurrent({ societe: v })} /><Field label=\"Secteur d’activité\" required value={form.secteur_activite} onChange={(v) => patchCurrent({ secteur_activite: v })} /><Field label=\"Statut\" required value={form.statut} onChange={(v) => patchCurrent({ statut: v })} placeholder=\"Autre statut\" /><Field label=\"Catégorie socioprofessionnelle\" value={form.categorie_socioprofessionnelle} onChange={(v) => patchCurrent({ categorie_socioprofessionnelle: v })} /><Field label=\"Depuis quelle date travaillez-vous dans cette entreprise / activité ?\" required={professionalNeedsEmployer} type=\"date\" value={form.date_entree} onChange={(v) => patchCurrent({ date_entree: v })} />{professionalNeedsIncomeOrigin && <Field label=\"Origine des revenus si sans activité\" required value={form.origine_revenus_sans_activite} onChange={(v) => patchCurrent({ origine_revenus_sans_activite: v })} />}</div>}",
              "{current.code === 'professional' && <div className=\"grid gap-4 sm:grid-cols-2\"><Field label=\"Profession actuelle\" required value={form.profession_actuelle} onChange={(v) => patchCurrent({ profession_actuelle: v })} /><Field label=\"Entreprise\" required={professionalNeedsEmployer} value={form.societe} onChange={(v) => patchCurrent({ societe: v })} /><Field label=\"Secteur d’activité\" required value={form.secteur_activite} onChange={(v) => patchCurrent({ secteur_activite: v })} /><Field label=\"Statut\" required value={form.statut} onChange={(v) => patchCurrent({ statut: v })} placeholder=\"Autre statut\" /><Field label=\"Catégorie socioprofessionnelle\" value={form.categorie_socioprofessionnelle} onChange={(v) => patchCurrent({ categorie_socioprofessionnelle: v })} /><Field label=\"Date d’entrée dans l’entreprise : mois / année\" required={professionalNeedsEmployer} type=\"month\" value={String(form.date_entree ?? '').slice(0, 7)} onChange={(v) => patchCurrent({ date_entree: v ? `${v}-01` : '' })} />{professionalNeedsIncomeOrigin && <Field label=\"Origine des revenus si sans activité\" required value={form.origine_revenus_sans_activite} onChange={(v) => patchCurrent({ origine_revenus_sans_activite: v })} />}{professionalNeedsChangeQuestion && <BoolChoice label=\"Un changement professionnel est-il prévu dans les prochains mois ?\" value={form.changement_professionnel_prevu} onChange={(v) => patchCurrent({ changement_professionnel_prevu: v, changement_professionnel_details: v ? form.changement_professionnel_details : '' })} />}{professionalNeedsChangeQuestion && form.changement_professionnel_prevu === true && <Field label=\"Quel changement professionnel est prévu ?\" required value={form.changement_professionnel_details} onChange={(v) => patchCurrent({ changement_professionnel_details: v })} placeholder=\"Ex. changement d’entreprise, création d’activité, retraite, évolution de rémunération…\" />}</div>}"
            )
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Motif introuvable: {old[:140]}')
            s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Adapter la date d'entrée et le changement professionnel"
          git push origin feat/professional-change-date-label