name: Apply validation UX policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-validation-ux.cjs'
      - '.github/workflows/apply-validation-ux-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply shared validation UX policy
        run: node scripts/enforce-validation-ux.cjs
      - name: Commit shared component change
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portal/FintechJourney.tsx
          git commit -m "Harmonize portal validation UX"
          git push origin main
