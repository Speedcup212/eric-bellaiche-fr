name: One-shot acquisition year

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-acquisition-year.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace acquisition date by acquisition year
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          old = "<Field label=\"Date d’acquisition\" type=\"month\" value={item.date_acquisition} onChange={(v) => updateList('immobilier', index, { date_acquisition: v })} help=\"Facultatif\" />"
          new = "<Field label=\"Année d’acquisition\" type=\"number\" value={item.date_acquisition} onChange={(v) => updateList('immobilier', index, { date_acquisition: v })} placeholder=\"Ex. 2018\" help=\"Facultatif\" />"
          if old not in s:
              raise SystemExit('Target acquisition field not found; no changes made')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "Speedcup212"
          git config user.email "eric.bellaiche@gmail.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Use acquisition year instead of acquisition date"
          git push origin main
