name: Normalize money and percent inputs

on:
  push:
    paths:
      - '.github/workflows/normalize-money-percent-inputs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch numeric input UX
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          old = '''function MoneyField(props: Omit<React.ComponentProps<typeof Field>, 'type'>) { return <Field {...props} type="number" />; }'''
          new = '''function MoneyField(props: Omit<React.ComponentProps<typeof Field>, 'type'>) {
  const { onChange, help, ...rest } = props;
  return <Field {...rest} type="text" onChange={(value) => onChange(String(value).replace(/[^\\d,.-]/g, '').replace(',', '.'))} help={help || 'Saisissez uniquement le montant, sans le symbole €. Exemple : 200000.'} />;
}'''
          if old not in s:
              raise SystemExit('MoneyField block not found')
          s = s.replace(old, new)

          old = '''                {(item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && <Field label={item.proprietaire === 'Identifiant 1 et 2' ? 'Quote-part de l’Identifiant 1 (%)' : 'Quote-part détenue (%)'} required type="number" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: v })} placeholder="Ex. 50" help={item.proprietaire === 'Identifiant 1 et 2' ? 'La part de l’Identifiant 2 sera déduite automatiquement (100 % moins cette valeur).' : 'Indiquez la part réellement détenue dans le bien.'} />}'''
          new = '''                {(item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && <Field label={item.proprietaire === 'Identifiant 1 et 2' ? 'Quote-part de l’Identifiant 1 (%)' : 'Quote-part détenue (%)'} required type="text" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: String(v).replace(/[^\\d,.-]/g, '').replace(',', '.') })} placeholder="Ex. 50" help={item.proprietaire === 'Identifiant 1 et 2' ? 'Saisissez uniquement le nombre, sans le symbole %. Exemple : 50. La part de l’Identifiant 2 sera déduite automatiquement.' : 'Saisissez uniquement le nombre, sans le symbole %. Exemple : 50.'} />}'''
          if old not in s:
              raise SystemExit('Quote-part field block not found')
          s = s.replace(old, new)

          old = "throw new Error('Indiquez une quote-part comprise entre 1 % et 99 % lorsque le bien est détenu à plusieurs.');"
          new = "throw new Error('Indiquez une quote-part comprise entre 1 % et 99 %. Saisissez uniquement le nombre, sans le symbole %. Exemple : 50.');"
          if old not in s:
              raise SystemExit('Quote-part validation message not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m 'Clarify and normalize money and percent inputs'
          git push origin main
