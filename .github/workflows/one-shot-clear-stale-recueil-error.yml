name: One-shot clear stale recueil error

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clear-stale-recueil-error.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clear stale recueil error when user edits a field
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          old = "const patchCurrent = (values: AnyPayload) => patch(current.code, values);"
          new = "const patchCurrent = (values: AnyPayload) => { setErrorMessage(''); patch(current.code, values); };"
          if old not in s:
              raise SystemExit('patchCurrent target not found; no changes made')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "Speedcup212"
          git config user.email "eric.bellaiche@gmail.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Clear stale recueil validation error on edit"
          git push origin main
