name: Fix dashboard progress for non-applicable ESG
on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-progress-not-applicable.yml'
      - 'scripts/patch-dashboard-progress-not-applicable.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-dashboard-progress-not-applicable.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/CifAdminPage.tsx
          git commit -m "Fix dashboard progress calculation" || exit 0
          git push
