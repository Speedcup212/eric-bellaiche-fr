name: One-shot reorder real estate fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reorder-real-estate-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reorder real estate fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          nom = '''                <div className="sm:col-span-2"><Field label="Nom du bien" required value={item.intitule ?? ''} onChange={(v) => updateList('immobilier', index, { intitule: v })} placeholder="Ex. Maison principale, Appartement Grenoble, Studio locatif Lyon…" help="Donnez un nom simple qui permettra d’identifier facilement ce bien dans votre dossier." /></div>\n'''
          type_bien = '''                <div><Field label="Type de bien" required value={item.type_bien} onChange={(v) => updateList('immobilier', index, { type_bien: v, type_bien_autre: v === 'Autre' ? item.type_bien_autre : '' })} />{item.type_bien === 'Autre' && <div className="mt-3"><Field label="Précisez le type de bien" required value={item.type_bien_autre} onChange={(v) => updateList('immobilier', index, { type_bien_autre: v })} /></div>}</div>\n'''
          usage = '''                <div><Field label="Usage" required value={item.usage} onChange={(v) => updateList('immobilier', index, { usage: v, usage_autre: v === 'Autre' ? item.usage_autre : '', loyer_annuel: v === 'Locatif' ? item.loyer_annuel : '' })} />{item.usage === 'Autre' && <div className="mt-3"><Field label="Précisez l’usage" required value={item.usage_autre} onChange={(v) => updateList('immobilier', index, { usage_autre: v })} /></div>}</div>\n'''
          ville = '''                <Field label="Ville" required value={item.ville} onChange={(v) => updateList('immobilier', index, { ville: v })} />\n'''
          owner = '''                <Field label="Propriétaire du bien" required value={item.proprietaire} onChange={(v) => updateList('immobilier', index, { proprietaire: v, quote_part: v === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision' ? item.quote_part : '100' })} help="Choisissez « Identifiant 1 et 2 » si le bien appartient aux deux personnes du dossier." />\n'''
          old = nom + type_bien + usage + ville + owner
          new = owner + nom + type_bien + usage + ville
          if old not in s:
              raise SystemExit('Target real estate field sequence not found; no changes made')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "Speedcup212"
          git config user.email "eric.bellaiche@gmail.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Reorder real estate fields for client flow"
          git push origin main
