name: Patch real estate city only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-city-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply city-only patch
        run: python scripts/patch_real_estate_city_only.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-city-only.yml scripts/patch_real_estate_city_only.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx .github/workflows/patch-city-only.yml scripts/patch_real_estate_city_only.py
          git commit -m "Limit real estate location to city"
          git push
