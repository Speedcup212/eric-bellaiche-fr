name: Apply unused identity count cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-remove-unused-identity-count.yml'
      - 'scripts/patch-remove-unused-identity-count.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-remove-unused-identity-count.cjs
      - run: npm ci
      - run: npm run test:portal-safety
      - run: npm run test:recueil-100
      - run: npm run test:investor-profile
      - run: npm run typecheck:portal
      - run: npm run lint
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientDocumentsPage.tsx
          git commit -m "Remove unused document identity counter" || exit 0
          git push
