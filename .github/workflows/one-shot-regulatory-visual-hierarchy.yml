name: One-shot simplify credit recueil

on:
  push:
    paths:
      - '.github/workflows/one-shot-regulatory-visual-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch credit UX
        run: node scripts/patch-credit-recueil.cjs
      - name: Verify
        run: |
          npm ci
          npm run typecheck:portal
          npm run build
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m 'Simplify credit recueil UX'
          git push origin main
