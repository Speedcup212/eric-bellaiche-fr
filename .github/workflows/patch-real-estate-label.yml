name: Patch real estate labels

on:
  push:
    paths:
      - '.github/workflows/patch-real-estate-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add a client-defined name to each property
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          text = path.read_text(encoding='utf-8')

          old = "const emptyRealEstate = () => ({ type_bien: '', type_bien_autre: '', usage: '', usage_autre: '', proprietaire: '', mode_detention: '', mode_detention_autre: '', quote_part: '', valeur_actuelle: '', date_acquisition: '', prix_acquisition: '', ville: '', loyer_annuel: '', commentaire: '' });"
          new = "const emptyRealEstate = () => ({ intitule: '', type_bien: '', type_bien_autre: '', usage: '', usage_autre: '', proprietaire: '', mode_detention: '', mode_detention_autre: '', quote_part: '', valeur_actuelle: '', date_acquisition: '', prix_acquisition: '', ville: '', loyer_annuel: '', commentaire: '' });"
          if old in text:
              text = text.replace(old, new, 1)

          old = "if ([item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.valeur_actuelle, item.ville].some(isBlank)) throw new Error('Complétez les informations principales de chaque bien immobilier.');"
          new = "if ([item.intitule, item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.valeur_actuelle, item.ville].some(isBlank)) throw new Error('Complétez le nom et les informations principales de chaque bien immobilier.');"
          if old in text:
              text = text.replace(old, new, 1)

          old = "if ([item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.valeur_actuelle, item.ville].some(isBlank)) return false;"
          new = "if ([item.intitule, item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.valeur_actuelle, item.ville].some(isBlank)) return false;"
          if old in text:
              text = text.replace(old, new, 1)

          old = '<div className="mb-5 flex items-center justify-between gap-3"><div><h4 className="font-semibold text-slate-900">Bien immobilier {index + 1}</h4></div><button type="button"'
          new = '<div className="mb-5 flex items-center justify-between gap-3"><div><h4 className="font-semibold text-slate-900">Bien immobilier {index + 1}{item.intitule ? ` — ${item.intitule}` : \'\'}</h4></div><button type="button"'
          if old in text:
              text = text.replace(old, new, 1)

          anchor = '<div className="recueil-question-grid recueil-question-grid--2 grid gap-x-5 gap-y-7 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-8">\n                <div><Field label="Type de bien"'
          replacement = '<div className="recueil-question-grid recueil-question-grid--2 grid gap-x-5 gap-y-7 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-8">\n                <div className="sm:col-span-2"><Field label="Nom du bien" required value={item.intitule ?? \'\'} onChange={(v) => updateList(\'immobilier\', index, { intitule: v })} placeholder="Ex. Maison principale, Appartement Grenoble, Studio locatif Lyon…" help="Donnez un nom simple qui permettra d’identifier facilement ce bien dans votre dossier." /></div>\n                <div><Field label="Type de bien"'
          if anchor in text:
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Speedcup212"
          git config user.email "eric.bellaiche@gmail.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Add a custom name for each real estate property"
          git push
