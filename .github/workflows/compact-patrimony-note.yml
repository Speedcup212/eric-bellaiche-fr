name: Compact patrimony info note

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-patrimony-note.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update real-estate information note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''          <div className="rounded-xl border border-sky-300/20 bg-[#17263f] px-4 py-2.5 text-xs leading-5 text-[#cfdef0]"><strong className="text-white">Aucun justificatif immobilier n’est demandé.</strong> Les prêts éventuels sont renseignés séparément dans « Crédits en cours ».</div>'''
          new = '''          <div className="rounded-xl border border-sky-300/20 bg-[#17263f] px-4 py-2.5 text-xs leading-5 text-[#cfdef0]"><strong className="text-white">Aucun justificatif immobilier n’est demandé.</strong> Les prêts éventuels seront à transmettre dans la partie « Justificatifs ».</div>'''
          if old not in s:
              raise SystemExit('Target patrimony note not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Clarify loan supporting documents wording"
          git push
