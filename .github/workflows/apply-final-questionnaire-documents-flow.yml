name: Apply final questionnaire documents flow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-final-questionnaire-documents-flow.cjs'
      - '.github/workflows/apply-final-questionnaire-documents-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/patch-final-questionnaire-documents-flow.cjs
      - name: Validate portal
        run: |
          npm ci
          npm run typecheck:portal
          npm run build
      - name: Commit flow correction
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/QuestionnairePageBase.tsx src/pages/portal/ClientDocumentsPage.tsx
          git commit -m "Fix questionnaire to documents final flow"
          git push origin main
