name: Improve real estate client form

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/improve-real-estate-form.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve patrimonial real estate UX
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          s = s.replace("  'Usage': { options: ['Résidence principale', 'Résidence secondaire', 'Locatif'], allowCustom: true },\n  'Type de bien': { options: ['Appartement', 'Maison', 'Immeuble', 'Terrain', 'Local professionnel / commercial'], allowCustom: true },\n  'Propriétaire du bien': { options: ['Identifiant 1', 'Identifiant 2', 'Commun / indivision'], allowCustom: true },\n  'Mode de détention': { options: ['Pleine propriété', 'Nue-propriété', 'Usufruit', 'Indivision', 'SCI'], allowCustom: true },",
          "  'Usage': { options: ['Résidence principale', 'Résidence secondaire', 'Locatif', 'Autre'] },\n  'Type de bien': { options: ['Appartement', 'Maison', 'Immeuble', 'Terrain', 'Local professionnel / commercial', 'Autre'] },\n  'Propriétaire du bien': { options: ['Identifiant 1', 'Identifiant 2', 'Les deux'] },\n  'Comment ce bien est-il détenu ?': { options: ['En direct', 'En indivision', 'Via une SCI', 'Nue-propriété', 'Usufruit', 'Autre'] },")

          old_validation = """        for (const item of form.immobilier ?? []) {\n          if ([item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.quote_part, item.valeur_actuelle, item.ville].some(isBlank)) throw new Error('Complétez les informations principales de chaque bien immobilier.');\n        }"""
          new_validation = """        for (const item of form.immobilier ?? []) {\n          if ([item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.valeur_actuelle, item.ville].some(isBlank)) throw new Error('Complétez les informations principales de chaque bien immobilier.');\n          if (item.type_bien === 'Autre' && isBlank(item.type_bien_autre)) throw new Error('Précisez le type du bien immobilier.');\n          if (item.usage === 'Autre' && isBlank(item.usage_autre)) throw new Error('Précisez l’usage du bien immobilier.');\n          if (item.mode_detention === 'Autre' && isBlank(item.mode_detention_autre)) throw new Error('Précisez comment le bien immobilier est détenu.');\n          if ((item.proprietaire === 'Les deux' || item.mode_detention === 'En indivision') && (isBlank(item.quote_part) || Number(item.quote_part) <= 0 || Number(item.quote_part) >= 100)) throw new Error('Indiquez une quote-part comprise entre 1 % et 99 % lorsque le bien est détenu à plusieurs.');\n          if (item.usage === 'Locatif' && isBlank(item.loyer_annuel)) throw new Error('Indiquez le loyer annuel hors charges pour chaque bien locatif.');\n        }"""
          if old_validation not in s:
              raise SystemExit('validation block not found')
          s = s.replace(old_validation, new_validation, 1)

          old_bool = """          <BoolChoice label=\"Détenez-vous un ou plusieurs biens immobiliers ?\" value={form.has_real_estate ?? ''} onChange={(v) => patchCurrent({ has_real_estate: v, immobilier: v ? (form.immobilier ?? []) : [] })} />"""
          new_bool = """          <BoolChoice label=\"Détenez-vous un ou plusieurs biens immobiliers ?\" value={form.has_real_estate ?? ''} onChange={(v) => {\n            if (!v && (form.immobilier ?? []).length > 0 && !window.confirm('Vous avez déjà renseigné un ou plusieurs biens. Passer à « Non » supprimera ces informations. Confirmez-vous ?')) return;\n            patchCurrent({ has_real_estate: v, immobilier: v ? (form.immobilier ?? []) : [] });\n          }} />"""
          if old_bool not in s:
              raise SystemExit('real estate bool block not found')
          s = s.replace(old_bool, new_bool, 1)

          old_add = "{ type_bien: '', usage: '', proprietaire: '', mode_detention: '', quote_part: '', valeur_actuelle: '', date_acquisition: '', prix_acquisition: '', ville: '', loyer_annuel: '', commentaire: '' }"
          new_add = "{ type_bien: '', type_bien_autre: '', usage: '', usage_autre: '', proprietaire: '', mode_detention: '', mode_detention_autre: '', quote_part: '', valeur_actuelle: '', date_acquisition: '', prix_acquisition: '', ville: '', loyer_annuel: '', commentaire: '' }"
          if old_add not in s:
              raise SystemExit('new property template not found')
          s = s.replace(old_add, new_add, 1)

          old_remove = """<button type=\"button\" onClick={() => removeList('immobilier', index)} className=\"inline-flex items-center gap-1 text-xs font-semibold text-red-600\"><Trash2 className=\"h-3.5 w-3.5\" /> Supprimer</button>"""
          new_remove = """<button type=\"button\" onClick={() => { if (window.confirm(`Supprimer définitivement le bien ${index + 1} ?`)) removeList('immobilier', index); }} className=\"inline-flex items-center gap-1 text-xs font-semibold text-red-600\"><Trash2 className=\"h-3.5 w-3.5\" /> Supprimer</button>"""
          if old_remove not in s:
              raise SystemExit('remove property button not found')
          s = s.replace(old_remove, new_remove, 1)

          old_fields = """                <Field label=\"Type de bien\" required value={item.type_bien} onChange={(v) => updateList('immobilier', index, { type_bien: v })} placeholder=\"Autre type de bien\" />\n                <Field label=\"Usage\" required value={item.usage} onChange={(v) => updateList('immobilier', index, { usage: v })} />\n                <Field label=\"Propriétaire du bien\" required value={item.proprietaire} onChange={(v) => updateList('immobilier', index, { proprietaire: v })} />\n                <Field label=\"Mode de détention\" required value={item.mode_detention} onChange={(v) => updateList('immobilier', index, { mode_detention: v })} />\n                <Field label=\"Quote-part détenue (%)\" required type=\"number\" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: v })} placeholder=\"Ex. 100 ou 50\" />\n                <MoneyField label=\"Valeur estimée actuelle (€)\" required value={item.valeur_actuelle} onChange={(v) => updateList('immobilier', index, { valeur_actuelle: v })} />\n                <Field label=\"Date d’acquisition\" type=\"month\" value={item.date_acquisition} onChange={(v) => updateList('immobilier', index, { date_acquisition: v })} />\n                <MoneyField label=\"Prix d’acquisition (€)\" value={item.prix_acquisition} onChange={(v) => updateList('immobilier', index, { prix_acquisition: v })} />\n                <Field label=\"Ville\" required value={item.ville} onChange={(v) => updateList('immobilier', index, { ville: v })} />\n                {item.usage === 'Locatif' && <MoneyField label=\"Loyer annuel hors charges (€)\" value={item.loyer_annuel} onChange={(v) => updateList('immobilier', index, { loyer_annuel: v })} />}"""
          new_fields = """                <div><Field label=\"Type de bien\" required value={item.type_bien} onChange={(v) => updateList('immobilier', index, { type_bien: v, type_bien_autre: v === 'Autre' ? item.type_bien_autre : '' })} />{item.type_bien === 'Autre' && <div className=\"mt-3\"><Field label=\"Précisez le type de bien\" required value={item.type_bien_autre} onChange={(v) => updateList('immobilier', index, { type_bien_autre: v })} /></div>}</div>\n                <div><Field label=\"Usage\" required value={item.usage} onChange={(v) => updateList('immobilier', index, { usage: v, usage_autre: v === 'Autre' ? item.usage_autre : '', loyer_annuel: v === 'Locatif' ? item.loyer_annuel : '' })} />{item.usage === 'Autre' && <div className=\"mt-3\"><Field label=\"Précisez l’usage\" required value={item.usage_autre} onChange={(v) => updateList('immobilier', index, { usage_autre: v })} /></div>}</div>\n                <Field label=\"Ville\" required value={item.ville} onChange={(v) => updateList('immobilier', index, { ville: v })} />\n                <Field label=\"Propriétaire du bien\" required value={item.proprietaire} onChange={(v) => updateList('immobilier', index, { proprietaire: v, quote_part: v === 'Les deux' || item.mode_detention === 'En indivision' ? item.quote_part : '100' })} help=\"Choisissez « Les deux » si le bien appartient aux deux personnes du dossier.\" />\n                <div><Field label=\"Comment ce bien est-il détenu ?\" required value={item.mode_detention} onChange={(v) => updateList('immobilier', index, { mode_detention: v, mode_detention_autre: v === 'Autre' ? item.mode_detention_autre : '', quote_part: v === 'En indivision' || item.proprietaire === 'Les deux' ? item.quote_part : '100' })} />{item.mode_detention === 'Autre' && <div className=\"mt-3\"><Field label=\"Précisez le mode de détention\" required value={item.mode_detention_autre} onChange={(v) => updateList('immobilier', index, { mode_detention_autre: v })} /></div>}</div>\n                {(item.proprietaire === 'Les deux' || item.mode_detention === 'En indivision') && <Field label={item.proprietaire === 'Les deux' ? 'Quote-part de l’Identifiant 1 (%)' : 'Quote-part détenue (%)'} required type=\"number\" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: v })} placeholder=\"Ex. 50\" help={item.proprietaire === 'Les deux' ? 'La part de l’Identifiant 2 sera déduite automatiquement (100 % moins cette valeur).' : 'Indiquez la part réellement détenue dans le bien.'} />}\n                <MoneyField label=\"Valeur estimée actuelle (€)\" required value={item.valeur_actuelle} onChange={(v) => updateList('immobilier', index, { valeur_actuelle: v })} />\n                <Field label=\"Date d’acquisition\" type=\"month\" value={item.date_acquisition} onChange={(v) => updateList('immobilier', index, { date_acquisition: v })} help=\"Facultatif\" />\n                <MoneyField label=\"Prix d’acquisition (€)\" value={item.prix_acquisition} onChange={(v) => updateList('immobilier', index, { prix_acquisition: v })} help=\"Facultatif\" />\n                {item.usage === 'Locatif' && <MoneyField label=\"Loyer annuel hors charges (€)\" required value={item.loyer_annuel} onChange={(v) => updateList('immobilier', index, { loyer_annuel: v })} />}"""
          if old_fields not in s:
              raise SystemExit('property fields block not found')
          s = s.replace(old_fields, new_fields, 1)

          # make property labels more legible on the white card
          s = s.replace('className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"', 'className="rounded-2xl border border-slate-200 bg-white p-5 text-slate-800 shadow-sm sm:p-6"', 1)

          p.write_text(s)
          PY

      - name: Commit improvements and remove temporary workflow
        run: |
          rm .github/workflows/improve-real-estate-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx .github/workflows/improve-real-estate-form.yml
          git commit -m "Improve real estate recueil client UX"
          git push
