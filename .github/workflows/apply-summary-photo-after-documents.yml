name: Apply summary photo after documents
on:
  push:
    paths:
      - '.github/workflows/apply-summary-photo-after-documents.yml'
      - 'scripts/patch-summary-photo-after-documents.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-summary-photo-after-documents.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/CifDossierSummaryPage.tsx
          git commit -m "Place patrimonial snapshot below dossier documents" || exit 0
          git push
