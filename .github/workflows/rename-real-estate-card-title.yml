name: Rename real estate card title

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-real-estate-card-title.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename real estate card title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text(encoding='utf-8')
          old = '<div><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Bien {index + 1}</p><h4 className="mt-1 font-semibold text-slate-900">{item.type_bien || \'Bien immobilier\'}</h4></div>'
          new = '<div><h4 className="font-semibold text-slate-900">Bien immobilier {index + 1}</h4></div>'
          if old not in s:
              raise SystemExit('Target real estate title block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Simplify real estate card title"
          git push
