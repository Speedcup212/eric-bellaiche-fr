name: Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/portail-client-cgp]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Level 5 cross-layer crash test
        run: npm run test:level5
      - name: Portal runtime safety
        run: npm run test:portal-safety
      - name: Recueil crash test (100 synthetic dossiers)
        run: npm run test:recueil-100
      - name: Client preflight (10 synthetic scenarios)
        run: npm run test:preflight-clients
      - name: Métier consistency engine
        run: npm run test:consistency
      - name: Data status engine
        run: npm run test:data-status
      - name: Advisor summary engine
        run: npm run test:advisor-summary
      - name: Couple family policy
        run: npm run test:couple-policy
      - name: Household consolidation engine
        run: npm run test:household-consolidation
      - name: Investor profile engine
        run: npm run test:investor-profile
      - name: Document requirements policy
        run: npm run test:document-policy
      - name: Final journey cross-layer crash test
        run: npm run test:final-journey
      - name: Generated document pipeline
        run: npm run test:generated-documents
      - name: Audit document pipeline
        run: npm run test:audit-documents
      - name: Adequation document pipeline
        run: npm run test:adequation-documents
      - name: Typecheck portal
        run: npm run typecheck:portal
      - name: Lint portal
        run: npx eslint src/lib src/portal src/pages/portal src/App.tsx scripts
      - name: Build
        run: npm run build
      - name: Critical route smoke test
        run: npm run test:routes
      - name: Install Firefox smoke runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Firefox portal smoke test
        run: node scripts/firefox-smoke.mjs
