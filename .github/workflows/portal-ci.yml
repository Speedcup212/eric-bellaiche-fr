name: Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/portail-client-cgp]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Portal runtime safety
        run: npm run test:portal-safety
      - name: Typecheck portal
        run: npm run typecheck:portal
      - name: Lint portal
        run: npx eslint src/lib src/portal src/pages/portal src/App.tsx
      - name: Build
        run: npm run build
