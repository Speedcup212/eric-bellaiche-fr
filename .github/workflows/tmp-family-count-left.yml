name: Temporary family child-count alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-family-count-left.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move Nombre enfants to the left
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/portal/ClientRecueilJourneyBase.tsx';
          let text = fs.readFileSync(path, 'utf8');
          const oldBlock = `<div className="flex flex-wrap items-end justify-between gap-3">\n              <div>\n                <h3 className="text-base font-semibold text-[#F1F5F9]">Enfants</h3>\n                <p className="mt-1 text-xs leading-5 text-[#94A3B8]">Renseignez l'identité et l'année de naissance de chaque enfant.</p>\n              </div>\n              <div className="w-full sm:w-44">\n                <Field label="Nombre d’enfants" required type="number" value={form.nombre_enfants} onChange={resizeChildren} />\n              </div>\n            </div>`;
          const newBlock = `<div>\n              <h3 className="text-base font-semibold text-[#F1F5F9]">Enfants</h3>\n              <p className="mt-1 text-xs leading-5 text-[#94A3B8]">Renseignez l'identité et l'année de naissance de chaque enfant.</p>\n              <div className="mt-3 w-full sm:w-44">\n                <Field label="Nombre d’enfants" required type="number" value={form.nombre_enfants} onChange={resizeChildren} />\n              </div>\n            </div>`;
          if (!text.includes(oldBlock)) throw new Error('Children header/count block not found');
          text = text.replace(oldBlock, newBlock);
          fs.writeFileSync(path, text);
          NODE
      - name: Verify
        run: |
          npm ci
          npm run typecheck:portal
          npm run build
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-family-count-left.yml
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m 'Place child count field on the left'
          git push origin main
