name: Apply compact QPI header
on:
  push:
    paths:
      - '.github/workflows/apply-qpi-compact-header.yml'
      - 'scripts/patch-qpi-compact-header.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-qpi-compact-header.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit compact QPI header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/QuestionnairePageBase.tsx src/portal/FintechJourney.tsx
          git commit -m "Compact QPI header before questions" || exit 0
          git push
