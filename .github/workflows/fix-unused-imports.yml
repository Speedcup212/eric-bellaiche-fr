name: Fix unused recueil imports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-unused-imports.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused icon imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          old = "import { Building2, CalendarDays, CheckCircle2, ChevronLeft, ChevronRight, FileText, HelpCircle, Landmark, Loader2, Plus, Sparkles, Trash2 } from 'lucide-react';"
          new = "import { CalendarDays, CheckCircle2, ChevronLeft, ChevronRight, HelpCircle, Loader2, Plus, Trash2 } from 'lucide-react';"
          if old not in s:
              raise SystemExit('expected import line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          rm .github/workflows/fix-unused-imports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx .github/workflows/fix-unused-imports.yml
          git commit -m "Fix recueil unused imports blocking Netlify build"
          git push
