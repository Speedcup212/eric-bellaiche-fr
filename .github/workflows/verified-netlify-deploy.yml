name: Verified Netlify deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verified-netlify-main
  cancel-in-progress: true

jobs:
  verify-and-release:
    if: ${{ !contains(github.event.head_commit.message, '[netlify-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy gate
        run: npm run test:deploy-gate

      - name: Production build
        run: npm run build

      - name: Create verified release commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git commit --allow-empty -m "chore(deploy): verified ${SOURCE_SHA} [netlify-verified]"
          git push origin HEAD:main
