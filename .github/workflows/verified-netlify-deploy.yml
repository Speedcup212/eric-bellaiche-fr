name: Verified Netlify deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: verified-netlify-main
  cancel-in-progress: true

jobs:
  verify-and-release:
    if: ${{ !contains(github.event.head_commit.message, '[netlify-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy gate
        run: npm run test:release-gate

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Production build
        run: npm run build

      - name: Require complete Portal CI success
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 65); do
            response=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/portal-ci.yml/runs?head_sha=${SOURCE_SHA}&event=push&per_page=5")
            state=$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | .[0].status // "missing"' <<< "$response")
            result=$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | .[0].conclusion // "pending"' <<< "$response")
            echo "Portal CI for ${SOURCE_SHA}: ${state}/${result} (check ${attempt}/65)"
            if [ "$state" = "completed" ]; then
              if [ "$result" = "success" ]; then
                echo "All Portal CI jobs passed."
                exit 0
              fi
              echo "::error::Portal CI did not pass. Production release refused."
              exit 1
            fi
            sleep 12
          done
          echo "::error::Portal CI was not successful before the release deadline."
          exit 1

      - name: Create verified release commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "::error::Main moved after verification; refusing to sign untested changes."
            exit 1
          fi
          git commit --allow-empty -m "chore(deploy): verified ${SOURCE_SHA} [netlify-verified]"
          git push origin HEAD:main
