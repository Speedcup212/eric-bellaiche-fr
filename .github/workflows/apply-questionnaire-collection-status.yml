name: Apply questionnaire collection status
on:
  push:
    paths:
      - '.github/workflows/apply-questionnaire-collection-status.yml'
      - 'scripts/fix-questionnaire-collection-status.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fix-questionnaire-collection-status.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit application and remove one-off files
        run: |
          rm -f scripts/fix-questionnaire-collection-status.cjs .github/workflows/apply-questionnaire-collection-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/CifDossierSummaryPage.tsx scripts/fix-questionnaire-collection-status.cjs .github/workflows/apply-questionnaire-collection-status.yml
          git commit -m "Show all client questionnaires with completion status"
          git push
