name: One-shot larger owner buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-owner-buttons-larger.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase owner button text size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          old = "isPropertyOwner ? 'whitespace-nowrap px-2 text-[11px] sm:text-xs' : 'px-3.5 text-sm'"
          new = "isPropertyOwner ? 'whitespace-nowrap px-2 text-xs sm:px-3 sm:text-sm' : 'px-3.5 text-sm'"
          if old not in s:
              raise SystemExit('Target owner button size class not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "Speedcup212"
          git config user.email "eric.bellaiche@gmail.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Increase real estate owner button text size"
          git push origin main
