name: Apply regulatory question borders
on:
  push:
    paths:
      - '.github/workflows/apply-regulatory-question-borders.yml'
      - 'scripts/patch-regulatory-question-borders.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-regulatory-question-borders.cjs
      - run: npm ci
      - run: npm run test:recueil-100
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/patrimony-dark.css
          git commit -m "Reinforce regulatory question borders" || exit 0
          git push
