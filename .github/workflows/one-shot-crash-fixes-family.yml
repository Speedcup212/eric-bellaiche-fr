name: Crash-test fixes family setup

on:
  push:
    paths:
      - '.github/workflows/one-shot-crash-fixes-family.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch family setup validation and error UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyPage.tsx')
          s = p.read_text()

          marker = "const regimes = ['Communauté réduite aux acquêts', 'Communauté universelle', 'Séparation de biens', 'Participation aux acquêts', 'PACS - séparation des patrimoines', 'PACS - indivision', 'Sans convention / non applicable'];\n"
          addition = marker + "\nfunction isValidEmail(value: string): boolean {\n  return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value.trim());\n}\n\nfunction isValidMobile(value: string): boolean {\n  const compact = value.trim().replace(/[\\s().-]/g, '');\n  if (!compact) return true;\n  if (/^0[67]\\d{8}$/.test(compact)) return true;\n  if (/^\\+33[67]\\d{8}$/.test(compact)) return true;\n  return /^\\+[1-9]\\d{7,14}$/.test(compact);\n}\n"
          if 'function isValidEmail(value: string)' not in s:
              if marker not in s: raise SystemExit('regimes marker not found')
              s = s.replace(marker, addition, 1)

          old = """      if (!family.dossier_scope) throw new Error('Indiquez si ce dossier concerne une personne ou un couple.');
      if (!family.situation || family.nombre_enfants === '') throw new Error('Indiquez votre situation familiale et le nombre d’enfants.');
      if (legalDetailsRequired && (!family.date_evenement || !family.regime_convention)) throw new Error('Pour une situation mariée ou pacsée, indiquez la date et le régime / la convention.');
      if (isCouple && (!family.conjoint_civilite || !family.conjoint_prenom.trim() || !family.conjoint_nom.trim() || !family.conjoint_email.trim())) {
        throw new Error('Complétez les informations de la deuxième personne : civilité, prénom, nom et email personnel.');
      }
"""
          new = """      if (!family.dossier_scope) throw new Error('Indiquez si ce dossier concerne une personne ou un couple.');
      if (!family.situation) throw new Error('Indiquez votre situation familiale.');
      const childCount = Number(family.nombre_enfants);
      if (family.nombre_enfants === '' || !Number.isInteger(childCount) || childCount < 0) throw new Error('Indiquez un nombre d’enfants valide, supérieur ou égal à 0.');
      if (legalDetailsRequired && (!family.date_evenement || !family.regime_convention)) throw new Error('Pour une situation mariée ou pacsée, indiquez la date et le régime / la convention.');
      if (isCouple && (!family.conjoint_civilite || !family.conjoint_prenom.trim() || !family.conjoint_nom.trim() || !family.conjoint_email.trim())) {
        throw new Error('Complétez les informations de l’Identifiant 2 : civilité, prénom, nom et email personnel.');
      }
      if (isCouple && !isValidEmail(family.conjoint_email)) throw new Error('Indiquez une adresse email personnelle valide pour l’Identifiant 2.');
      if (isCouple && family.conjoint_mobile.trim() && !isValidMobile(family.conjoint_mobile)) throw new Error('Indiquez un numéro de mobile valide pour l’Identifiant 2.');
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const childCount = Number(family.nombre_enfants);' not in s:
              raise SystemExit('validation block not found')

          old_error = """        {errorMessage && <p className="mt-5 rounded-2xl bg-red-50 p-4 text-sm text-red-700">{errorMessage}</p>}
"""
          new_error = """        {errorMessage && <div id="family-validation-alert" role="alert" tabIndex={-1} className="mt-5 scroll-mt-28 rounded-2xl border border-amber-300 bg-amber-50 p-4 text-sm leading-6 text-amber-950"><p className="font-semibold">À compléter avant de continuer</p><p className="mt-1">{errorMessage}</p></div>}
"""
          if old_error in s:
              s = s.replace(old_error, new_error, 1)
          elif 'id="family-validation-alert"' not in s:
              raise SystemExit('family error block not found')

          effect_marker = "  const saveFamilySetup = async () => {\n"
          effect = """  useEffect(() => {
    if (!errorMessage) return;
    const timer = window.setTimeout(() => {
      const alert = document.getElementById('family-validation-alert');
      alert?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      alert?.focus({ preventScroll: true });
    }, 50);
    return () => window.clearTimeout(timer);
  }, [errorMessage]);

  const saveFamilySetup = async () => {
"""
          if "document.getElementById('family-validation-alert')" not in s:
              if effect_marker not in s: raise SystemExit('saveFamilySetup marker not found')
              s = s.replace(effect_marker, effect, 1)

          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck:portal
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyPage.tsx
          git commit -m 'Harden family setup validation and error UX'
          git pull --rebase origin main
          git push origin main
