name: Patch month year numeric format
on:
  push:
    branches: [ux/month-year-numeric-format]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/month-year-numeric-format
          fetch-depth: 0
      - name: Use numeric month and slash separator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/RecueilUxEnhancements.tsx')
          s = p.read_text()
          s = s.replace("wrapper.className = 'mt-2 grid grid-cols-2 gap-2';", "wrapper.className = 'mt-2 grid grid-cols-[1fr_auto_1fr] items-end gap-2';")
          s = s.replace("for (const [code, name] of frenchMonths) monthSelect.append(createOption(code, name));", "for (const [code] of frenchMonths) monthSelect.append(createOption(code, code));")
          old = "        wrapper.append(monthBox, yearBox);"
          new = "        const separator = document.createElement('span');\n        separator.className = 'pb-3 text-base font-semibold text-slate-500';\n        separator.textContent = '/';\n        wrapper.append(monthBox, separator, yearBox);"
          if old not in s:
            raise SystemExit('Point insertion séparateur introuvable')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/portal/RecueilUxEnhancements.tsx
          git commit -m "Afficher la date d'entrée au format MM/AAAA"
          git push origin ux/month-year-numeric-format
