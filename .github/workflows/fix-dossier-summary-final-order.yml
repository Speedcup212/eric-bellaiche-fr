name: Fix dossier summary final order
on:
  push:
    paths:
      - '.github/workflows/fix-dossier-summary-final-order.yml'
      - 'scripts/fix-dossier-summary-final-order.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fix-dossier-summary-final-order.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit final order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/CifDossierSummaryPage.tsx
          git commit -m "Set definitive dossier summary order" || exit 0
          git push
