name: Patch nom de naissance Mme
on:
  push:
    branches: [fix/nom-naissance-mme]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nom-naissance-mme
      - name: Patch Recueil
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()
          old = "  const familySituation = String(forms.family.situation ?? '').toLowerCase();"
          new = "  const identityNeedsBirthName = String(forms.identity.civilite ?? '').trim().toLowerCase() === 'mme';\n  const familySituation = String(forms.family.situation ?? '').toLowerCase();"
          if old in s and 'identityNeedsBirthName' not in s:
              s = s.replace(old, new, 1)
          old = "      if ([form.civilite, form.prenom, form.nom, form.date_naissance, form.lieu_naissance, form.pays_naissance, form.nationalite, form.mobile].some(isBlank)) throw new Error('Complétez tous les champs obligatoires de votre identité.');"
          new = old + "\n      if (identityNeedsBirthName && isBlank(form.nom_naissance)) throw new Error('Indiquez votre nom de naissance. Ce champ est obligatoire lorsque la civilité est Mme.');"
          if old in s and "civilité est Mme" not in s:
              s = s.replace(old, new, 1)
          old = '<Field label="Nom de naissance" value={form.nom_naissance} onChange={(v) => patchCurrent({ nom_naissance: v })} />'
          new = '<Field label="Nom de naissance" required={identityNeedsBirthName} value={form.nom_naissance} onChange={(v) => patchCurrent({ nom_naissance: v })} placeholder="Nom figurant sur votre acte de naissance" />'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Rendre le nom de naissance obligatoire pour Mme"
          git push
