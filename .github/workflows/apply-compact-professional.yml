name: Apply compact professional layout
on:
  push:
    paths:
      - '.github/workflows/apply-compact-professional.yml'
      - 'scripts/patch-compact-professional.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-compact-professional.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit compact layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-compact-professional.cjs .github/workflows/apply-compact-professional.yml
          git add -A
          git commit -m "Compact professional recueil layout" || exit 0
          git push
