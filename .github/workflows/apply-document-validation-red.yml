name: Apply document validation feedback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-document-validation-red.cjs'
      - '.github/workflows/apply-document-validation-red.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/patch-document-validation-red.cjs
      - name: Commit application change
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientDocumentsPage.tsx
          git commit -m "Show blocking document answers in red"
          git push origin main
