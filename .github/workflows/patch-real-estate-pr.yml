name: Patch real estate recueil via PR

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_real_estate_patch.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply real estate patch
        run: python scripts/patch_real_estate.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx src/pages/portal/ClientDocumentsPage.tsx
          git commit -m "Add structured real estate section to patrimonial recueil"
          git push origin HEAD:${{ github.head_ref }}
