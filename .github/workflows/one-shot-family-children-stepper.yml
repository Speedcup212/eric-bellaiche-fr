name: One-shot family children stepper

on:
  push:
    paths:
      - '.github/workflows/one-shot-family-children-stepper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch children count
        run: node scripts/patch-family-children-stepper.cjs
      - name: Verify
        run: |
          npm ci
          npm run test:recueil-100
          npm run typecheck:portal
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyBase.tsx scripts/patch-family-children-stepper.cjs
          git rm .github/workflows/one-shot-family-children-stepper.yml
          git commit -m 'Fix children count control'
          git push origin main
