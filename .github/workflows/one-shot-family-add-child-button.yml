name: One-shot family add child button

on:
  push:
    paths:
      - '.github/workflows/one-shot-family-add-child-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply child add/remove UX
        run: node scripts/patch-family-add-child-button.cjs
      - name: Verify
        run: |
          npm ci
          npm run test:recueil-100
          npm run typecheck:portal
          npm run build
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git rm scripts/patch-family-add-child-button.cjs .github/workflows/one-shot-family-add-child-button.yml
          git commit -m 'Replace child counter with add child button'
          git push origin main
