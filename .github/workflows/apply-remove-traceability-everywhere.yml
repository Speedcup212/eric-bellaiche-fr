name: Remove traceability everywhere
on:
  push:
    paths:
      - '.github/workflows/apply-remove-traceability-everywhere.yml'
      - 'scripts/patch-hide-trace-identity.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-hide-trace-identity.cjs
      - run: npm ci
      - run: npm run test:recueil-100
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Remove recueil traceability block everywhere" || exit 0
          git push
