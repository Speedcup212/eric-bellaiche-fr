name: One-shot global recueil validation warning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-global-validation-warning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add visible validation warning on every recueil page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          old = """  const saveCurrent = async () => {\n    if (!progress) return;\n    validateSection();"""
          new = """  const currentValidationIssue = (() => {\n    try {\n      validateSection();\n      return '';\n    } catch (error) {\n      return messageFromError(error);\n    }\n  })();\n\n  const saveCurrent = async () => {\n    if (!progress) return;\n    validateSection();"""
          if old not in s:
              raise SystemExit('saveCurrent insertion target not found')
          s = s.replace(old, new, 1)

          old = """          if ((item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && (isBlank(item.quote_part) || Number(item.quote_part) <= 0 || Number(item.quote_part) >= 100)) throw new Error('Indiquez une quote-part comprise entre 1 % et 99 % lorsque le bien est détenu à plusieurs.');"""
          new = """          const quotePartValue = Number(String(item.quote_part ?? '').replace(',', '.').replace('%', '').trim());\n          if ((item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && (isBlank(item.quote_part) || !Number.isFinite(quotePartValue) || quotePartValue <= 0 || quotePartValue >= 100)) throw new Error('Indiquez une quote-part comprise entre 1 % et 99 % lorsque le bien est détenu à plusieurs.');"""
          if old not in s:
              raise SystemExit('validate quote-part target not found')
          s = s.replace(old, new, 1)

          old = """      payloadToSave = { ...form, collection_mode: 'real_estate_manual', placements: [...placementsWithoutAccounts, ...(form.comptes_courants ?? []).map(accountToPlacement)] };"""
          new = """      payloadToSave = { ...form, immobilier: (form.immobilier ?? []).map((item: AnyPayload) => ({ ...item, quote_part: isBlank(item.quote_part) ? item.quote_part : String(item.quote_part).replace(',', '.').replace('%', '').trim() })), collection_mode: 'real_estate_manual', placements: [...placementsWithoutAccounts, ...(form.comptes_courants ?? []).map(accountToPlacement)] };"""
          if old not in s:
              raise SystemExit('payload normalization target not found')
          s = s.replace(old, new, 1)

          old = """    if ((item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && (isBlank(item.quote_part) || Number(item.quote_part) <= 0 || Number(item.quote_part) >= 100)) return false;"""
          new = """    const quotePartValue = Number(String(item.quote_part ?? '').replace(',', '.').replace('%', '').trim());\n    if ((item.proprietaire === 'Identifiant 1 et 2' || item.mode_detention === 'En indivision') && (isBlank(item.quote_part) || !Number.isFinite(quotePartValue) || quotePartValue <= 0 || quotePartValue >= 100)) return false;"""
          if old not in s:
              raise SystemExit('patrimonyReady quote-part target not found')
          s = s.replace(old, new, 1)

          old = """        {errorMessage && <p className=\"rounded-2xl bg-red-50 p-4 text-sm text-red-700\">{errorMessage}</p>}\n        {current.code === 'patrimony' ?"""
          new = """        {currentValidationIssue && <div role=\"alert\" className=\"rounded-2xl border border-amber-400/60 bg-amber-50 px-5 py-4 text-sm leading-6 text-amber-950 shadow-sm\"><p className=\"font-semibold\">À compléter avant de continuer</p><p className=\"mt-1\">{currentValidationIssue}</p></div>}\n        {errorMessage && <p className=\"rounded-2xl bg-red-50 p-4 text-sm text-red-700\">{errorMessage}</p>}\n        {current.code === 'patrimony' ?"""
          if old not in s:
              raise SystemExit('warning render target not found')
          s = s.replace(old, new, 1)

          old = """disabled={busy || !patrimonyReady}"""
          new = """disabled={busy || Boolean(currentValidationIssue)}"""
          if old not in s:
              raise SystemExit('button disabled target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Show orange validation warning on every recueil page"
          git push origin main
