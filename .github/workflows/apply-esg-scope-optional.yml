name: Apply ESG scope optional precision
on:
  push:
    paths:
      - '.github/workflows/apply-esg-scope-optional.yml'
      - 'scripts/patch-esg-scope-optional.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-esg-scope-optional.cjs
      - run: npm ci
      - run: npm run test:recueil-100
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/QuestionnairePageBase.tsx
          git commit -m "Make ESG scope precision optional" || exit 0
          git push
