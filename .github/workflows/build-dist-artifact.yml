name: Build dist artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-dist-artifact.yml
      - scripts/build_dist_trigger.txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
