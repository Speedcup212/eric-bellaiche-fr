name: Apply dependency audit fix

on:
  push:
    paths:
      - '.github/workflows/apply-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply safe audit fixes to lockfile
        run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run test:level5
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit lockfile remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix audited dependency vulnerabilities"
          git push

# Re-run marker: level-5-calibrated-v2
