name: Patch French month year entry
on:
  push:
    branches: [fix/french-month-year-entry]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/french-month-year-entry
          fetch-depth: 0
      - name: Replace native month input with French month/year selects
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          marker = "function BoolChoice({ label, value, onChange, required = true }: { label: string; value: boolean | ''; onChange: (value: boolean) => void; required?: boolean }) {"
          component = r'''const frenchMonths = [
  ['01', 'Janvier'], ['02', 'Février'], ['03', 'Mars'], ['04', 'Avril'], ['05', 'Mai'], ['06', 'Juin'],
  ['07', 'Juillet'], ['08', 'Août'], ['09', 'Septembre'], ['10', 'Octobre'], ['11', 'Novembre'], ['12', 'Décembre'],
] as const;

function MonthYearField({ label, value, onChange, required = false }: { label: string; value: any; onChange: (value: string) => void; required?: boolean }) {
  const parsed = /^(\d{4})-(\d{2})/.exec(String(value ?? ''));
  const [month, setMonth] = useState(parsed?.[2] ?? '');
  const [year, setYear] = useState(parsed?.[1] ?? '');

  useEffect(() => {
    const match = /^(\d{4})-(\d{2})/.exec(String(value ?? ''));
    if (match) {
      setYear(match[1]);
      setMonth(match[2]);
    }
  }, [value]);

  const currentYear = new Date().getFullYear();
  const years = Array.from({ length: currentYear - 1940 + 1 }, (_, index) => String(currentYear - index));
  const commit = (nextMonth: string, nextYear: string) => onChange(nextMonth && nextYear ? `${nextYear}-${nextMonth}-01` : '');

  return <div className="text-sm font-semibold text-slate-700">
    <p>{label}{required && ' *'}</p>
    <p className="mt-1 text-xs font-normal text-slate-500">Sélectionnez uniquement le mois et l’année.</p>
    <div className="mt-2 grid grid-cols-2 gap-2">
      <label className="text-xs font-medium text-slate-600">Mois
        <select value={month} onChange={(e) => { const next = e.target.value; setMonth(next); commit(next, year); }} className="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm text-slate-800 outline-none transition focus:border-slate-400 focus:bg-white">
          <option value="">Mois</option>
          {frenchMonths.map(([code, name]) => <option key={code} value={code}>{name}</option>)}
        </select>
      </label>
      <label className="text-xs font-medium text-slate-600">Année
        <select value={year} onChange={(e) => { const next = e.target.value; setYear(next); commit(month, next); }} className="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm text-slate-800 outline-none transition focus:border-slate-400 focus:bg-white">
          <option value="">Année</option>
          {years.map((item) => <option key={item} value={item}>{item}</option>)}
        </select>
      </label>
    </div>
  </div>;
}

'''
          if marker not in s:
            raise SystemExit('Marker BoolChoice introuvable')
          s = s.replace(marker, component + marker, 1)

          old = '<Field label="Date d’entrée dans l’entreprise : mois / année" required={professionalNeedsEmployer} type="month" value={String(form.date_entree ?? \'\').slice(0, 7)} onChange={(v) => patchCurrent({ date_entree: v ? `${v}-01` : \'\' })} />'
          new = '<MonthYearField label="Date d’entrée dans l’entreprise : mois / année" required={professionalNeedsEmployer} value={form.date_entree} onChange={(v) => patchCurrent({ date_entree: v })} />'
          if old not in s:
            raise SystemExit('Champ date entrée introuvable')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Afficher le mois et l'année en français"
          git push origin fix/french-month-year-entry
