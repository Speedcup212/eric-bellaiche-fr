name: Restore patrimony dark theme

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-patrimony-dark-theme.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harmonize patrimony form colors
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = tsx.read_text(encoding='utf-8')

          old = "{choice.options.map((option) => <button key={option} type=\"button\" onClick={() => onChange(option)} className={`"
          new = "{choice.options.map((option) => <button key={option} type=\"button\" aria-pressed={normalizedValue === option} onClick={() => onChange(option)} className={`"
          if old in s:
              s = s.replace(old, new, 1)

          old_card = 'className="rounded-2xl border border-slate-200 bg-white p-5 text-slate-800 shadow-sm sm:p-6"'
          new_card = 'className="patrimony-dark rounded-2xl border border-white/10 bg-[#111C31] p-5 text-[#F1F5F9] shadow-lg shadow-black/10 sm:p-6"'
          if old_card not in s:
              raise SystemExit('Patrimony card target not found')
          s = s.replace(old_card, new_card, 1)

          old_delete = 'className="inline-flex items-center gap-1 text-xs font-semibold text-red-600"'
          new_delete = 'className="patrimony-delete inline-flex items-center gap-1 text-xs font-semibold text-red-400 hover:text-red-300"'
          if old_delete in s:
              s = s.replace(old_delete, new_delete, 1)

          tsx.write_text(s, encoding='utf-8')

          css = Path('src/index.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* patrimony-dark-theme */'
          if marker not in c:
              c += r'''

/* patrimony-dark-theme */
.patrimony-dark {
  background: #111c31 !important;
  border-color: rgba(148, 163, 184, 0.22) !important;
  color: #f1f5f9 !important;
}

.patrimony-dark h4,
.patrimony-dark label,
.patrimony-dark .text-slate-700,
.patrimony-dark .text-slate-800,
.patrimony-dark .text-slate-900 {
  color: #f1f5f9 !important;
}

.patrimony-dark .text-slate-400,
.patrimony-dark .text-slate-500,
.patrimony-dark .text-\[\#94A3B8\] {
  color: #94a3b8 !important;
}

.patrimony-dark input,
.patrimony-dark textarea,
.patrimony-dark select {
  background: #0f1b2d !important;
  border-color: #334155 !important;
  color: #f1f5f9 !important;
  box-shadow: none !important;
}

.patrimony-dark input::placeholder,
.patrimony-dark textarea::placeholder {
  color: #64748b !important;
  opacity: 1;
}

.patrimony-dark button[aria-pressed="false"] {
  background: #16233a !important;
  border-color: #334155 !important;
  color: #e2e8f0 !important;
}

.patrimony-dark button[aria-pressed="false"]:hover {
  background: #1d2d48 !important;
  border-color: #3b82f6 !important;
  color: #ffffff !important;
}

.patrimony-dark button[aria-pressed="true"] {
  background: #3b82f6 !important;
  border-color: #3b82f6 !important;
  color: #ffffff !important;
  box-shadow: 0 8px 22px -14px rgba(59, 130, 246, 0.9) !important;
}

.patrimony-dark .patrimony-delete {
  background: transparent !important;
  border-color: transparent !important;
  color: #f87171 !important;
}

.patrimony-dark .patrimony-delete:hover {
  color: #fca5a5 !important;
}
'''
              css.write_text(c, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx src/index.css
          git commit -m "Restore dark theme on patrimony property cards"
          git push
