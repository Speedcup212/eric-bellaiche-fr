name: Apply PDF-first documents

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-pdf-first-documents.cjs
      - .github/workflows/apply-pdf-first-documents.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: node scripts/patch-pdf-first-documents.cjs
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
      - name: Portal runtime safety
        run: npm run test:portal-safety
      - name: Recueil crash test 100 dossiers
        run: npm run test:recueil-100
      - name: Metier consistency engine
        run: npm run test:consistency
      - name: Data status engine
        run: npm run test:data-status
      - name: Advisor summary engine
        run: npm run test:advisor-summary
      - name: Couple family policy
        run: npm run test:couple-policy
      - name: Household consolidation engine
        run: npm run test:household-consolidation
      - name: Investor profile engine
        run: npm run test:investor-profile
      - name: Document requirements policy
        run: npm run test:document-policy
      - name: Generated PDF document pipeline
        run: npm run test:generated-documents
      - name: Typecheck portal
        run: npm run typecheck:portal
      - name: Lint portal
        run: npx eslint src/lib src/portal src/pages/portal src/App.tsx scripts
      - name: Build
        run: npm run build
      - name: Critical route smoke
        run: npm run test:routes
      - name: Install Firefox
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Firefox portal smoke
        run: node scripts/firefox-smoke.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/CifDossierSummaryPage.tsx scripts/test-generated-document-pipeline.mjs package.json
          git diff --cached --check
          git commit -m "Use PDF as final regulatory document format" || exit 0
          git push origin main
