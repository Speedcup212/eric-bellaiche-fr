name: One-shot refine matrimonial advantage

on:
  push:
    paths:
      - '.github/workflows/one-shot-refine-matrimonial-advantage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update matrimonial advantage UX
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/portal/ClientRecueilJourneyBase.tsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldChoice = "  'Avantage matrimonial': { options: ['Je ne sais pas / à vérifier', 'Aucun aménagement particulier', 'Clause de préciput', 'Attribution intégrale de la communauté'], allowCustom: true },";
          const newChoice = "  'Avantage ou clause matrimoniale particulière': { options: ['Je ne sais pas / à vérifier', 'Aucun avantage matrimonial particulier', 'Clause de préciput', 'Attribution intégrale de la communauté'], allowCustom: true },";
          if (!text.includes(oldChoice)) throw new Error('Matrimonial choice definition not found');
          text = text.replace(oldChoice, newChoice);

          const oldField = '<Field label="Avantage matrimonial" required value={form.avantage_matrimonial} onChange={(v) => patchCurrent({ avantage_matrimonial: v })} placeholder="Autre avantage / précisez" />';
          const newField = '<Field label="Avantage ou clause matrimoniale particulière" required value={form.avantage_matrimonial} onChange={(v) => patchCurrent({ avantage_matrimonial: v })} placeholder="Précisez la clause ou l’avantage matrimonial" />';
          if (!text.includes(oldField)) throw new Error('Matrimonial field not found');
          text = text.replace(oldField, newField);

          const oldCustom = "}`}>Autre</button>}";
          const newCustom = "}`}>{label === 'Avantage ou clause matrimoniale particulière' ? 'Autre — à préciser' : 'Autre'}</button>}";
          if (!text.includes(oldCustom)) throw new Error('Custom choice button not found');
          text = text.replace(oldCustom, newCustom);

          text = text.replace("Indiquez l’avantage matrimonial ou choisissez « Je ne sais pas / à vérifier ».", "Indiquez l’avantage ou la clause matrimoniale particulière, ou choisissez « Je ne sais pas / à vérifier ».");

          if (!text.includes("Aucun avantage matrimonial particulier")) throw new Error('New no-advantage choice missing');
          if (!text.includes("Autre — à préciser")) throw new Error('Custom label missing');
          if (text.includes("label=\"Avantage matrimonial\"")) throw new Error('Old field label still present');

          fs.writeFileSync(path, text);
          NODE
      - name: Verify
        run: |
          npm ci
          npm run test:recueil-100
          npm run typecheck:portal
          npm run build
      - name: Commit and self-clean
        run: |
          rm .github/workflows/one-shot-refine-matrimonial-advantage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Refine matrimonial advantage choices'
          git push origin main
