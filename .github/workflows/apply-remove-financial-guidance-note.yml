name: Remove financial guidance note
on:
  push:
    paths:
      - '.github/workflows/apply-remove-financial-guidance-note.yml'
      - 'scripts/remove-financial-guidance-note.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/remove-financial-guidance-note.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx
          git commit -m "Remove financial guidance note" || exit 0
          git push
