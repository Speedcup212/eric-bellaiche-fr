name: Add recueil duration estimate

on:
  push:
    paths:
      - '.github/workflows/one-shot-add-recueil-duration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add duration estimate to recueil entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/portal/ClientRecueilEntryPage.tsx')
          s = p.read_text()
          old = '''      <WizardCard className="p-6 sm:p-8">\n        <div className="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3">'''
          new = '''      <WizardCard className="p-6 sm:p-8">\n        <div className="mb-5 rounded-2xl border border-sky-200 bg-sky-50 px-5 py-4">\n          <p className="text-base font-semibold text-[#0B1F3A]">Temps estimé : environ 45 minutes</p>\n          <p className="mt-1 text-sm leading-6 text-slate-600">C’est le temps moyen nécessaire pour compléter l’ensemble du questionnaire. Vous pouvez interrompre le parcours et le reprendre à tout moment.</p>\n        </div>\n\n        <div className="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3">'''
          if old not in s:
              raise SystemExit('entry insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck:portal
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/ClientRecueilEntryPage.tsx
          git commit -m 'Show 45 minute recueil estimate'
          git push origin main
