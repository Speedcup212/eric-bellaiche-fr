name: Patch premium client journey
on:
  push:
    branches: [ux/premium-journey-rebuild]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/premium-journey-rebuild
          fetch-depth: 0
      - name: Rebuild recueil UX and journey consistency
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Introuvable: {label}')
              return text.replace(old, new, 1)

          # --- Recueil: native React fields, no DOM mutation hack ---
          p = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          s = p.read_text()

          start = s.index('function Field(')
          end = s.index('function MoneyField', start)
          field_block = r'''function Field({ label, value, onChange, type = 'text', required = false, placeholder = '' }: { label: string; value: any; onChange: (value: string) => void; type?: string; required?: boolean; placeholder?: string }) {
  const choice = choiceFields[label];
  if (choice) {
    const normalizedValue = value === null || value === undefined ? '' : String(value);
    const isCustomValue = normalizedValue !== '' && !choice.options.includes(normalizedValue);
    return <div className="overflow-hidden rounded-2xl border border-[#cdd9e7] bg-white shadow-sm">
      <div className="bg-[#0b1f3a] px-4 py-2.5 text-sm font-semibold text-white">{label}{required && ' *'}</div>
      <div className="p-3.5">
        <div className="flex flex-wrap gap-2">
          {choice.options.map((option) => <button key={option} type="button" onClick={() => onChange(option)} className={`rounded-xl border px-3.5 py-2.5 text-sm font-semibold transition ${normalizedValue === option ? 'border-[#173967] bg-[#173967] text-white shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:border-[#8ca6c4] hover:bg-blue-50/50'}`}>{option}</button>)}
        </div>
        {choice.allowCustom && <input type={type} value={isCustomValue ? normalizedValue : ''} onChange={(e) => onChange(e.target.value)} placeholder={placeholder || 'Autre / précisez'} className="mt-3 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 font-normal text-slate-800 outline-none transition focus:border-[#6f8fb4] focus:bg-white" />}
      </div>
    </div>;
  }
  return <label className="block overflow-hidden rounded-2xl border border-[#cdd9e7] bg-white shadow-sm">
    <span className="block bg-[#0b1f3a] px-4 py-2.5 text-sm font-semibold text-white">{label}{required && ' *'}</span>
    <span className="block p-3.5"><input type={type} value={value ?? ''} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition focus:border-[#6f8fb4] focus:bg-white" /></span>
  </label>;
}

function BoolChoice({ label, value, onChange, required = true }: { label: string; value: boolean | ''; onChange: (value: boolean) => void; required?: boolean }) {
  return <div className="overflow-hidden rounded-2xl border border-[#cdd9e7] bg-white shadow-sm">
    <p className="bg-[#0b1f3a] px-4 py-2.5 text-sm font-semibold text-white">{label}{required && ' *'}</p>
    <div className="grid grid-cols-2 gap-2 p-3.5">{[[true, 'Oui'], [false, 'Non']].map(([v, text]) => <button key={text as string} type="button" onClick={() => onChange(v as boolean)} className={`rounded-xl border px-4 py-3 text-sm font-semibold transition ${value === v ? 'border-[#173967] bg-[#173967] text-white' : 'border-slate-200 bg-white text-slate-700 hover:border-[#8ca6c4] hover:bg-blue-50/50'}`}>{text as string}</button>)}</div>
  </div>;
}

const monthOptions = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];

function MonthYearField({ value, onChange, required = false }: { value: any; onChange: (value: string) => void; required?: boolean }) {
  const initialMatch = /^(\d{4})-(0[1-9]|1[0-2])/.exec(String(value ?? ''));
  const [month, setMonth] = useState(initialMatch?.[2] ?? '');
  const [year, setYear] = useState(initialMatch?.[1] ?? '');

  useEffect(() => {
    const match = /^(\d{4})-(0[1-9]|1[0-2])/.exec(String(value ?? ''));
    setYear(match?.[1] ?? '');
    setMonth(match?.[2] ?? '');
  }, [value]);

  const currentYear = new Date().getFullYear();
  const years = Array.from({ length: currentYear - 1940 + 1 }, (_, index) => String(currentYear - index));
  const commit = (nextMonth: string, nextYear: string) => onChange(nextMonth && nextYear ? `${nextYear}-${nextMonth}-01` : '');

  return <div className="overflow-hidden rounded-2xl border border-[#cdd9e7] bg-white shadow-sm">
    <div className="bg-[#0b1f3a] px-4 py-2.5 text-sm font-semibold text-white">Date d’entrée dans l’entreprise{required && ' *'}</div>
    <div className="p-3.5">
      <p className="mb-3 text-xs leading-5 text-slate-500">Sélectionnez le mois puis l’année. Exemple : <strong>05/2015</strong>.</p>
      <div className="grid grid-cols-[1fr_auto_1fr] items-end gap-2">
        <label className="text-xs font-semibold text-slate-600">Mois
          <select value={month} onChange={(event) => { const next = event.target.value; setMonth(next); commit(next, year); }} className="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm text-slate-800 outline-none focus:border-[#6f8fb4] focus:bg-white">
            <option value="">MM</option>
            {monthOptions.map((item) => <option key={item} value={item}>{item}</option>)}
          </select>
        </label>
        <span className="pb-3 text-lg font-semibold text-slate-500">/</span>
        <label className="text-xs font-semibold text-slate-600">Année
          <select value={year} onChange={(event) => { const next = event.target.value; setYear(next); commit(month, next); }} className="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm text-slate-800 outline-none focus:border-[#6f8fb4] focus:bg-white">
            <option value="">AAAA</option>
            {years.map((item) => <option key={item} value={item}>{item}</option>)}
          </select>
        </label>
      </div>
      {month && year && <p className="mt-3 rounded-xl bg-[#eef4fb] px-3 py-2 text-sm font-semibold text-[#173967]">Date sélectionnée : {month}/{year}</p>}
    </div>
  </div>;
}

function normalizedMobile(value: string): { compact: string; digits: string } {
  const compact = value.trim().replace(/[\s().-]/g, '');
  return { compact, digits: compact.replace(/\D/g, '') };
}

function isValidMobile(value: string): boolean {
  const { compact, digits } = normalizedMobile(value);
  if (!digits) return false;
  if (['0000000000', '0123456789', '1234567890'].includes(digits)) return false;
  if (/^(\d)\1+$/.test(digits) && digits.length >= 8) return false;
  if (/^0[67]\d{8}$/.test(compact)) return true;
  if (/^\+33[67]\d{8}$/.test(compact)) return true;
  return /^\+[1-9]\d{7,14}$/.test(compact);
}

'''
          s = s[:start] + field_block + s[end:]

          s = must_replace(
              s,
              "  const [errorMessage, setErrorMessage] = useState('');\n",
              "  const [errorMessage, setErrorMessage] = useState('');\n  const [accountEmail, setAccountEmail] = useState('');\n",
              'state email'
          )

          marker = "  useEffect(() => {\n    void fetchPortalProgress().then(async (progressRows) => {"
          email_effect = "  useEffect(() => {\n    let active = true;\n    void supabase.auth.getUser().then(({ data }) => { if (active) setAccountEmail(data.user?.email ?? ''); });\n    return () => { active = false; };\n  }, []);\n\n"
          if marker not in s:
              raise SystemExit('Introuvable: useEffect principal')
          s = s.replace(marker, email_effect + marker, 1)

          s = must_replace(
              s,
              "      if ([form.civilite, form.prenom, form.nom, form.date_naissance, form.lieu_naissance, form.pays_naissance, form.nationalite, form.mobile].some(isBlank)) throw new Error('Complétez tous les champs obligatoires de votre identité.');\n",
              "      if ([form.civilite, form.prenom, form.nom, form.date_naissance, form.lieu_naissance, form.pays_naissance, form.nationalite, form.mobile].some(isBlank)) throw new Error('Complétez tous les champs obligatoires de votre identité.');\n      if (!isValidMobile(String(form.mobile ?? ''))) throw new Error('Indiquez un numéro de mobile valide. Les numéros fictifs ou incohérents sont refusés.');\n",
              'validation mobile'
          )

          s = must_replace(
              s,
              '<JourneyProgress current="recueil" esgEnabled={forms.regulatory.esg_opt_in !== false} />',
              '<JourneyProgress current="recueil" esgEnabled={forms.regulatory.esg_opt_in !== false} substep={{ current: step + 1, total: sections.length, label: current.title }} />',
              'progression recueil'
          )

          old_nav = '<div className="border-b border-slate-100 px-6 py-4 sm:px-9"><div className="flex flex-wrap gap-2">{sections.map((section, index) => <button key={section.code} type="button" onClick={() => setStep(index)} className={`rounded-full px-3 py-1.5 text-xs font-semibold ${index === step ? \'bg-slate-950 text-white\' : doneSections.has(section.code) ? \'bg-emerald-50 text-emerald-700\' : \'bg-slate-100 text-slate-500\'}`}>{doneSections.has(section.code) ? \'✓ \' : \'\'}{index + 1}</button>)}</div></div>'
          new_nav = '<div className="border-b border-[#dbe4ef] bg-[#f7f9fc] px-6 py-4 sm:px-9"><div className="flex items-center justify-between gap-4"><div><p className="text-xs font-bold uppercase tracking-[0.14em] text-[#6f8198]">Navigation du recueil</p><p className="mt-1 text-sm font-semibold text-[#0b1f3a]">{current.title}</p></div><span className="rounded-full bg-[#e7eef7] px-3 py-1 text-xs font-bold text-[#173967]">{step + 1}/{sections.length}</span></div><div className="mt-3 flex gap-2 overflow-x-auto pb-1">{sections.map((section, index) => <button key={section.code} type="button" onClick={() => setStep(index)} className={`shrink-0 rounded-xl px-3 py-2 text-xs font-semibold transition ${index === step ? \'bg-[#0b1f3a] text-white\' : doneSections.has(section.code) ? \'bg-emerald-50 text-emerald-700\' : \'border border-[#dbe4ef] bg-white text-[#6f8198]\'}`}>{doneSections.has(section.code) ? \'✓ \' : \'\'}{index + 1}. {section.title}</button>)}</div></div>'
          s = must_replace(s, old_nav, new_nav, 'navigation recueil')

          old_mobile = '<Field label="Mobile" required value={form.mobile} onChange={(v) => patchCurrent({ mobile: v })} />'
          new_mobile = '<Field label="Mobile" required value={form.mobile} onChange={(v) => patchCurrent({ mobile: v })} placeholder="06 12 34 56 78 ou +33 6 12 34 56 78" /><label className="block overflow-hidden rounded-2xl border border-[#cdd9e7] bg-white shadow-sm"><span className="block bg-[#0b1f3a] px-4 py-2.5 text-sm font-semibold text-white">E-mail *</span><span className="block p-3.5"><input type="email" readOnly value={accountEmail} className="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-slate-700 outline-none" /><span className="mt-2 block text-xs font-normal leading-5 text-slate-500">Adresse liée à votre accès sécurisé. Elle est reprise automatiquement pour éviter toute erreur de saisie.</span></span></label>'
          s = must_replace(s, old_mobile, new_mobile, 'email sécurisé')

          old_month = '<Field label="Date d’entrée dans l’entreprise : mois / année" required={professionalNeedsEmployer} type="month" value={String(form.date_entree ?? \'\').slice(0, 7)} onChange={(v) => patchCurrent({ date_entree: v ? `${v}-01` : \'\' })} />'
          new_month = '<MonthYearField required={professionalNeedsEmployer} value={form.date_entree} onChange={(v) => patchCurrent({ date_entree: v })} />'
          s = must_replace(s, old_month, new_month, 'date MM/AAAA')

          s = s.replace('Après validation finale du recueil, vos réponses sont figées pour préserver la piste d’audit.', 'Après la transmission définitive du dossier, vos réponses sont figées pour préserver la piste d’audit.')
          s = s.replace('className="inline-flex items-center gap-2 rounded-xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white disabled:opacity-50"', 'className="inline-flex items-center gap-2 rounded-xl bg-[#0b1f3a] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#0b1f3a]/15 disabled:opacity-50"')
          p.write_text(s)

          # --- Questionnaire: expose question progress in the sticky journey header ---
          p = Path('src/pages/portal/QuestionnairePageBase.tsx')
          s = p.read_text()
          target = '<JourneyProgress current={mode === \'QPI\' ? \'qpi\' : \'esg\'} esgEnabled={progress.esg_opt_in !== false} />\n    <PageIntro eyebrow={mode === \'QPI\' ? \'Étape 2\' : \'Étape 3\'} title={introTitle}'
          replacement = '<JourneyProgress current={mode === \'QPI\' ? \'qpi\' : \'esg\'} esgEnabled={progress.esg_opt_in !== false} substep={{ current: currentIndex + 1, total: totalSteps, label: cardTitle }} />\n    <PageIntro eyebrow={mode === \'QPI\' ? \'Étape 2\' : \'Étape 3\'} title={introTitle}'
          s = must_replace(s, target, replacement, 'progression questionnaire')
          p.write_text(s)

          # --- Documents: same navy question hierarchy ---
          p = Path('src/pages/portal/ClientDocumentsPage.tsx')
          s = p.read_text()
          s = must_replace(
              s,
              "import { JourneyProgress, PageIntro, SecureNote, WizardCard, WizardFooter } from '../../portal/FintechJourney';",
              "import { JourneyProgress, PageIntro, QuestionHeader, SecureNote, WizardCard, WizardFooter } from '../../portal/FintechJourney';",
              'import QuestionHeader documents'
          )
          s = must_replace(
              s,
              '      <WizardCard>\n        {!transmitted ? (',
              '      <WizardCard>\n        <QuestionHeader current={1} total={1} label="Documents à transmettre" title="Quels justificatifs souhaitez-vous transmettre ?" description="Ajoutez les pièces utiles à votre situation. Le cabinet les utilisera pour compléter les données fiscales, les financements et contrôler les informations de votre dossier." />\n        {!transmitted ? (',
              'header documents'
          )
          s = s.replace('className="inline-flex items-center gap-2 rounded-xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-950/10 disabled:opacity-40"', 'className="inline-flex items-center gap-2 rounded-xl bg-[#0b1f3a] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#0b1f3a]/15 disabled:opacity-40"')
          p.write_text(s)

          # --- Remove the old DOM enhancement implementation entirely ---
          Path('src/pages/portal/RecueilUxEnhancements.tsx').write_text("export default function RecueilUxEnhancements() {\n  return null;\n}\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/portal/ClientRecueilJourneyBase.tsx src/pages/portal/QuestionnairePageBase.tsx src/pages/portal/ClientDocumentsPage.tsx src/pages/portal/RecueilUxEnhancements.tsx
          git commit -m "Refondre l'ergonomie du parcours client"
          git push origin ux/premium-journey-rebuild
