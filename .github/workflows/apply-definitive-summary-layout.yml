name: Apply definitive dossier summary layout
on:
  push:
    paths:
      - '.github/workflows/apply-definitive-summary-layout.yml'
      - 'scripts/apply-definitive-summary-layout.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/apply-definitive-summary-layout.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit definitive layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply definitive dossier summary visual order" || exit 0
          git push
