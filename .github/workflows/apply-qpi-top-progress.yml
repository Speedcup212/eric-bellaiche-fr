name: Apply lighter QPI top progress
on:
  push:
    paths:
      - '.github/workflows/apply-qpi-top-progress.yml'
      - 'scripts/patch-qpi-top-progress.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-qpi-top-progress.cjs
      - run: npm ci
      - run: npm run typecheck:portal
      - run: npm run build
      - name: Commit QPI top progress simplification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portal/FintechJourney.tsx src/pages/portal/QuestionnairePageBase.tsx
          git commit -m "Simplify QPI top progress" || exit 0
          git push
