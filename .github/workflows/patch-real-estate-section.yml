name: Patch real estate recueil section

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-real-estate-section.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recueil and document workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base_path = Path('src/pages/portal/ClientRecueilJourneyBase.tsx')
          text = base_path.read_text()

          old_section = "  { code: 'patrimony', title: 'Patrimoine immobilier et financier', description: 'Aucune saisie détaillée : vos justificatifs seront transmis à l’étape Documents pour préparer automatiquement votre dossier.' },"
          new_section = "  { code: 'patrimony', title: 'Patrimoine immobilier', description: 'Renseignez les biens immobiliers détenus et leur valeur estimée. Aucun justificatif immobilier n’est demandé à cette étape.' },"
          if old_section not in text:
              raise SystemExit('Section patrimony title not found')
          text = text.replace(old_section, new_section, 1)

          old_initial = "  patrimony: { comptes_courants: [], immobilier: [], placements: [] },"
          new_initial = "  patrimony: { has_real_estate: '', comptes_courants: [], immobilier: [], placements: [] },"
          if old_initial not in text:
              raise SystemExit('Initial patrimony payload not found')
          text = text.replace(old_initial, new_initial, 1)

          marker = "  'Mode de détention': { options: ['Pleine propriété', 'Nue-propriété', 'Usufruit'], allowCustom: true },"
          replacement = "  'Type de bien': { options: ['Appartement', 'Maison', 'Immeuble', 'Terrain', 'Local professionnel / commercial'], allowCustom: true },\n  'Propriétaire du bien': { options: ['Identifiant 1', 'Identifiant 2', 'Commun / indivision'], allowCustom: true },\n  'Mode de détention': { options: ['Pleine propriété', 'Nue-propriété', 'Usufruit', 'Indivision', 'SCI'], allowCustom: true },"
          if marker not in text:
              raise SystemExit('Choice marker not found')
          text = text.replace(marker, replacement, 1)

          validation_marker = "    if (current.code === 'credits') {\n      for (const item of form.items ?? []) if ([item.type_credit, item.banque, item.montant_initial, item.capital_restant_du, item.mensualite, item.duree_mois, item.taux, item.type_pret].some(isBlank)) throw new Error('Complétez toutes les informations principales de chaque crédit.');\n    }"
          validation_replacement = "    if (current.code === 'patrimony') {\n      if (form.has_real_estate === '') throw new Error('Indiquez si vous détenez un ou plusieurs biens immobiliers.');\n      if (form.has_real_estate === true) {\n        if (!Array.isArray(form.immobilier) || form.immobilier.length === 0) throw new Error('Ajoutez au moins un bien immobilier.');\n        for (const item of form.immobilier ?? []) {\n          if ([item.type_bien, item.usage, item.proprietaire, item.mode_detention, item.quote_part, item.valeur_actuelle, item.adresse, item.ville].some(isBlank)) throw new Error('Complétez les informations principales de chaque bien immobilier.');\n        }\n      }\n    }\n    if (current.code === 'credits') {\n      for (const item of form.items ?? []) if ([item.type_credit, item.banque, item.montant_initial, item.capital_restant_du, item.mensualite, item.duree_mois, item.taux, item.type_pret].some(isBlank)) throw new Error('Complétez toutes les informations principales de chaque crédit.');\n    }"
          if validation_marker not in text:
              raise SystemExit('Validation marker not found')
          text = text.replace(validation_marker, validation_replacement, 1)

          old_save = "      payloadToSave = { ...form, collection_mode: 'documents', placements: [...placementsWithoutAccounts, ...(form.comptes_courants ?? []).map(accountToPlacement)] };"
          new_save = "      payloadToSave = { ...form, collection_mode: 'real_estate_manual', placements: [...placementsWithoutAccounts, ...(form.comptes_courants ?? []).map(accountToPlacement)] };"
          if old_save not in text:
              raise SystemExit('Patrimony save mode not found')
          text = text.replace(old_save, new_save, 1)

          start = text.find("        {current.code === 'patrimony' && <div className=\"space-y-8\">")
          end = text.find("\n\n        {current.code === 'credits'", start)
          if start < 0 or end < 0:
              raise SystemExit('Patrimony JSX block not found')

          new_block = r'''        {current.code === 'patrimony' && <div className="space-y-7">
          <RecueilInfoNote title="Informations immobilières uniquement"><p>Renseignez vos biens directement dans le recueil. <strong>Aucun justificatif immobilier n’est demandé.</strong></p><p className="mt-1.5 text-[#aebfd4]">Les prêts éventuels sont renseignés séparément dans la partie « Crédits en cours ».</p></RecueilInfoNote>

          <BoolChoice label="Détenez-vous un ou plusieurs biens immobiliers ?" value={form.has_real_estate ?? ''} onChange={(v) => patchCurrent({ has_real_estate: v, immobilier: v ? (form.immobilier ?? []) : [] })} />

          {form.has_real_estate === false && <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-sm leading-6 text-emerald-800">Aucun bien immobilier déclaré. Vous pouvez continuer si cette situation est exacte.</div>}

          {form.has_real_estate === true && <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3"><div><h3 className="font-semibold text-slate-900">Vos biens immobiliers</h3><p className="mt-1 text-sm text-slate-500">Ajoutez chaque bien détenu, y compris la résidence principale, les biens locatifs et les résidences secondaires.</p></div><button type="button" onClick={() => patchCurrent({ immobilier: [...(form.immobilier ?? []), { type_bien: '', usage: '', proprietaire: '', mode_detention: '', quote_part: '', valeur_actuelle: '', date_acquisition: '', prix_acquisition: '', adresse: '', code_postal: '', ville: '', loyer_annuel: '', commentaire: '' }] })} className="inline-flex items-center gap-1.5 rounded-xl bg-[#0b1f3a] px-4 py-2.5 text-sm font-semibold text-white"><Plus className="h-4 w-4" /> Ajouter un bien</button></div>

            {(form.immobilier ?? []).length === 0 && <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm leading-6 text-amber-900">Vous avez indiqué détenir un bien immobilier. Ajoutez au moins un bien pour poursuivre.</div>}

            {(form.immobilier ?? []).map((item: AnyPayload, index: number) => <div key={index} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
              <div className="mb-5 flex items-center justify-between gap-3"><div><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Bien {index + 1}</p><h4 className="mt-1 font-semibold text-slate-900">{item.type_bien || 'Bien immobilier'}</h4></div><button type="button" onClick={() => removeList('immobilier', index)} className="inline-flex items-center gap-1 text-xs font-semibold text-red-600"><Trash2 className="h-3.5 w-3.5" /> Supprimer</button></div>
              <div className="recueil-question-grid recueil-question-grid--2 grid gap-x-5 gap-y-7 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-8">
                <Field label="Type de bien" required value={item.type_bien} onChange={(v) => updateList('immobilier', index, { type_bien: v })} placeholder="Autre type de bien" />
                <Field label="Usage" required value={item.usage} onChange={(v) => updateList('immobilier', index, { usage: v })} />
                <Field label="Propriétaire du bien" required value={item.proprietaire} onChange={(v) => updateList('immobilier', index, { proprietaire: v })} />
                <Field label="Mode de détention" required value={item.mode_detention} onChange={(v) => updateList('immobilier', index, { mode_detention: v })} />
                <Field label="Quote-part détenue (%)" required type="number" value={item.quote_part} onChange={(v) => updateList('immobilier', index, { quote_part: v })} placeholder="Ex. 100 ou 50" />
                <MoneyField label="Valeur estimée actuelle (€)" required value={item.valeur_actuelle} onChange={(v) => updateList('immobilier', index, { valeur_actuelle: v })} />
                <Field label="Date d’acquisition" type="month" value={item.date_acquisition} onChange={(v) => updateList('immobilier', index, { date_acquisition: v })} />
                <MoneyField label="Prix d’acquisition (€)" value={item.prix_acquisition} onChange={(v) => updateList('immobilier', index, { prix_acquisition: v })} />
                <Field label="Adresse du bien" required value={item.adresse} onChange={(v) => updateList('immobilier', index, { adresse: v })} placeholder="Numéro et voie" />
                <Field label="Code postal" value={item.code_postal} onChange={(v) => updateList('immobilier', index, { code_postal: v })} />
                <Field label="Ville" required value={item.ville} onChange={(v) => updateList('immobilier', index, { ville: v })} />
                {item.usage === 'Locatif' && <MoneyField label="Loyer annuel hors charges (€)" value={item.loyer_annuel} onChange={(v) => updateList('immobilier', index, { loyer_annuel: v })} />}
              </div>
              <label className="mt-5 block text-sm font-semibold text-slate-700">Précisions utiles<textarea value={item.commentaire ?? ''} onChange={(e) => updateList('immobilier', index, { commentaire: e.target.value })} rows={2} className="mt-2 w-full rounded-xl border border-[#CBD5E1] bg-white px-4 py-3 font-normal outline-none transition focus:border-[#3B82F6] focus:ring-2 focus:ring-blue-500/30" placeholder="Ex. indivision particulière, démembrement, projet de vente…" /></label>
            </div>)}
          </div>}
        </div>}'''

          text = text[:start] + new_block + text[end:]
          base_path.write_text(text)

          docs_path = Path('src/pages/portal/ClientDocumentsPage.tsx')
          docs = docs_path.read_text()
          docs = docs.replace("  ['patrimoine_immobilier', 'Bien immobilier / acte notarié'],\n", "")
          docs = docs.replace("    realEstate: contexts.some((item) => item.has_real_estate === true),\n", "")
          docs = docs.replace("    { category: 'patrimoine_immobilier', label: 'Patrimoine immobilier', description: 'À transmettre si vous détenez un bien immobilier.', status: conditionalStatus(aggregate.realEstate), expectedCount: aggregate.realEstate ? 1 : 0, receivedCount: categoryCounts.patrimoine_immobilier ?? 0 },\n", "")
          docs = docs.replace("            {boolChoice('Détenez-vous un ou plusieurs biens immobiliers ?', 'has_real_estate', currentContext?.has_real_estate)}\n", "")
          docs = docs.replace("context.has_real_estate === null || ", "")
          docs_path.write_text(docs)
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/patch-real-estate-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portal/ClientRecueilJourneyBase.tsx src/pages/portal/ClientDocumentsPage.tsx .github/workflows/patch-real-estate-section.yml
          git commit -m "Add structured real estate section to patrimonial recueil"
          git push
