name: Security npm hardening

on:
  push:
    branches: [security/npm-hardening-20260827]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/npm-hardening-20260827
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit before
        run: |
          npm audit --json > audit-before.json || true
          node -e "const a=require('./audit-before.json'); console.log('AUDIT_BEFORE', JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [k,v] of Object.entries(a.vulnerabilities||{})) console.log('BEFORE',k,v.severity,'fixAvailable='+JSON.stringify(v.fixAvailable))"
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix || true
      - name: Audit after non-breaking fixes
        run: |
          npm audit --json > audit-after.json || true
          node -e "const a=require('./audit-after.json'); console.log('AUDIT_AFTER', JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [k,v] of Object.entries(a.vulnerabilities||{})) console.log('AFTER',k,v.severity,'fixAvailable='+JSON.stringify(v.fixAvailable))"
          npm audit --omit=dev --json > runtime-audit.json || true
          node -e "const a=require('./runtime-audit.json'); console.log('RUNTIME_AUDIT', JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [k,v] of Object.entries(a.vulnerabilities||{})) console.log('RUNTIME',k,v.severity,'fixAvailable='+JSON.stringify(v.fixAvailable))"
      - name: Reinstall from lockfile
        run: npm ci
      - name: Portal runtime safety
        run: npm run test:portal-safety
      - name: Recueil crash test (100 dossiers)
        run: npm run test:recueil-100
      - name: Métier consistency engine
        run: npm run test:consistency
      - name: Data status engine
        run: npm run test:data-status
      - name: Advisor summary engine
        run: npm run test:advisor-summary
      - name: Couple family policy
        run: npm run test:couple-policy
      - name: Household consolidation engine
        run: npm run test:household-consolidation
      - name: Investor profile engine
        run: npm run test:investor-profile
      - name: Document requirements policy
        run: npm run test:document-policy
      - name: Typecheck portal
        run: npm run typecheck:portal
      - name: Lint portal
        run: npx eslint src/lib src/portal src/pages/portal src/App.tsx scripts
      - name: Build
        run: npm run build
      - name: Critical route smoke test
        run: npm run test:routes
      - name: Install Firefox smoke runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Firefox portal smoke test
        run: node scripts/firefox-smoke.mjs
      - name: Commit dependency hardening
        run: |
          rm -f audit-before.json audit-after.json runtime-audit.json
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Harden npm dependencies"
          git push origin HEAD:security/npm-hardening-20260827
