name: Client novice crash test 30 scenarios

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  novice-crash-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck portal
        run: npm run typecheck:portal
      - name: Build
        run: npm run build
      - name: Run novice UX scenarios
        run: node scripts/crash-test-novice-30.mjs
