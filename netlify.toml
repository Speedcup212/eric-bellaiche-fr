[build]
  command = "node scripts/patch-numeric-ux.cjs && node scripts/patch-recueil-order.cjs && node scripts/patch-novice-ux.cjs && npm run typecheck:portal && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
